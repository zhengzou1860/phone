name: Voice
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  Voice:
    type: application
    platform: iOS
    sources:
      - SourcesVoice
    info:
      path: Info-Voice.plist
      properties:
        CFBundleDisplayName: Voice
        CFBundleName: Voice
        CFBundleExecutable: Voice
        CFBundleIdentifier: com.qoder.voice
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "2"
        CFBundleInfoDictionaryVersion: "6.0"
        NSMicrophoneUsageDescription: "要录你的声音来做声音转换"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - fetch
          - background-transfer
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qoder.voice
        PRODUCT_NAME: Voice
        TARGETED_DEVICE_FAMILY: "1"
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_BITCODE: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
