name: Voice
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  Voice:
    type: application
    platform: iOS
    sources:
      # Fixtures 单独列：目录扫描会把整个目录当 folder reference 塞进包里的一层子目录，
      # 那样 Bundle.main.url(forResource:withExtension:) 就找不到了。逐个文件列，落进 .app 根。
      - path: SourcesVoice
        excludes:
          - "Fixtures/**"
      - path: SourcesVoice/Fixtures/synth16k_scaled.f32
        buildPhase: resources
      - path: SourcesVoice/Fixtures/fbank_expect.f32
        buildPhase: resources
      - path: SourcesVoice/Fixtures/pmel_expect.f32
        buildPhase: resources
      - path: SourcesVoice/Fixtures/librosa_mel_basis.f32
        buildPhase: resources
    info:
      path: Info-Voice.plist
      properties:
        CFBundleDisplayName: Voice
        CFBundleName: Voice
        CFBundleExecutable: Voice
        CFBundleIdentifier: com.qoder.voice
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "7"
        CFBundleInfoDictionaryVersion: "6.0"
        NSMicrophoneUsageDescription: "要录你的声音来做声音转换"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - fetch
          - background-transfer
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qoder.voice
        PRODUCT_NAME: Voice
        TARGETED_DEVICE_FAMILY: "1"
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_BITCODE: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
