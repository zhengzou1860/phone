name: Voice
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  Voice:
    type: application
    platform: iOS
    sources:
      # Fixtures 单独列：目录扫描会把整个目录当 folder reference 塞进包里的一层子目录，
      # 那样 Bundle.main.url(forResource:withExtension:) 就找不到了。逐个文件列，落进 .app 根。
      - path: SourcesVoice
        excludes:
          - "Fixtures/**"
      - path: SourcesVoice/Fixtures/synth16k_scaled.f32
        buildPhase: resources
      - path: SourcesVoice/Fixtures/fbank_expect.f32
        buildPhase: resources
      - path: SourcesVoice/Fixtures/pmel_expect.f32
        buildPhase: resources
      - path: SourcesVoice/Fixtures/librosa_mel_basis.f32
        buildPhase: resources
    info:
      path: Info-Voice.plist
      properties:
        CFBundleDisplayName: Voice
        CFBundleName: Voice
        CFBundleExecutable: Voice
        CFBundleIdentifier: com.qoder.voice
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "37"
        CFBundleInfoDictionaryVersion: "6.0"
        # 「导出到手机」的第二条路：开了这两个开关后 Documents 整个出现在「文件」app 里，
        # 录的音、样本、输出 wav 可以就地看和播，不必每条都点一次分享面板。
        # 代价就是同一个「文件」app 也把残留翻得到（他 10-12 提的）⇒ ContentView 的「历史文件」页负责删。
        # LiveContainer 里这两个键由宿主怎么透传没实测过，所以分享面板那条仍留着。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: "要录你的声音来做声音转换"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - fetch
          - background-transfer
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qoder.voice
        PRODUCT_NAME: Voice
        TARGETED_DEVICE_FAMILY: "1"
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_BITCODE: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        # Swift 只看 OrtShim.h（几百个函数指针的 OrtApi 结构体不给 Swift 导入器碰）。
        SWIFT_OBJC_BRIDGING_HEADER: SourcesVoice/Voice-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Vendor/onnxruntime.xcframework/ios-arm64/onnxruntime.framework/Headers"
        # 这个切片是个 fat 容器套 !<arch> 静态库，-framework 链法一个符号都进不去，
        # 只能 force_load 整档；ORT 本体是 C++，libc++ 要一起给。
        OTHER_LDFLAGS:
          - "-force_load"
          - "$(PROJECT_DIR)/Vendor/onnxruntime.xcframework/ios-arm64/onnxruntime.framework/onnxruntime"
          - "-lc++"
