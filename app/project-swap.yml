name: SwapBench
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  SwapBench:
    type: application
    platform: iOS
    # 只吃自己的目录。0.33 起模型彻底不进包：四张网由 CI 打成 models.bin 挂在 release 上，
    # 手机第一次用时自己下到 Documents/swap_models（改了程序不用重下模型）。
    # app 里 SwapNets.locate() 先找盘上那一份，找不到才退到包里（老 ipa 那样）。
    sources:
      - SourcesSwap
    info:
      path: Info-Swap.plist
      properties:
        CFBundleDisplayName: 换脸出片
        CFBundleName: SwapBench
        CFBundleExecutable: SwapBench
        CFBundleIdentifier: com.qoder.swapbench
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.33"
        CFBundleVersion: "33"
        CFBundleInfoDictionaryVersion: "6.0"
        NSPhotoLibraryAddUsageDescription: "要把换好脸的片段存回相册"
        NSPhotoLibraryUsageDescription: "要选一张源脸照片和一条要换脸的视频"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qoder.swapbench
        PRODUCT_NAME: SwapBench
        TARGETED_DEVICE_FAMILY: "1"
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_BITCODE: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
