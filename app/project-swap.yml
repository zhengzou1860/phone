name: SwapBench
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  SwapBench:
    type: application
    platform: iOS
    # 只吃自己的目录。模型彻底不进包：两张网＋chain.txt 由 CI 打成 models.bin 挂在 release 上，
    # 手机第一次用时自己下到 Documents/swap_models（改了程序不用重下模型，版本号＝两张 onnx 的 sha256）。
    # app 那边 FsxEngine.locate() 只认盘上那一份，没有「包里再塞一份」的退路。
    sources:
      - SourcesSwap
    info:
      path: Info-Swap.plist
      properties:
        CFBundleDisplayName: 换脸出片
        CFBundleName: SwapBench
        CFBundleExecutable: SwapBench
        CFBundleIdentifier: com.qoder.swapbench
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.44"
        CFBundleVersion: "44"
        CFBundleInfoDictionaryVersion: "6.0"
        NSPhotoLibraryAddUsageDescription: "要把换好脸的片段存回相册"
        NSPhotoLibraryUsageDescription: "要选一张源脸照片和一条要换脸的视频"
        # 0.34 起模型先从局域网上那台电脑拿（手机直连 GitHub 那条被掐着走，几百 MB 能爬一两个小时）。
        # 走局域网必须写这一句：iOS 14 以后没这句就直接把本机网络访问挡掉，连弹窗都不弹。
        NSLocalNetworkUsageDescription: "要把模型从同一张网上的电脑上拿到手机里"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qoder.swapbench
        PRODUCT_NAME: SwapBench
        TARGETED_DEVICE_FAMILY: "1"
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_BITCODE: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
