name: build-voice-ipa

on:
  push:
    branches: [voice]
    paths:
      - 'app/SourcesVoice/**'
      - 'app/project-voice.yml'
      - '.github/workflows/build-voice.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 自检 ZipExtractor（不通过不出包）
        run: |
          set +e          # GH Actions 默认 bash -e，一失败整块退出，日志就丢了
          L=/tmp/zt/step.log
          rm -rf /tmp/zt && mkdir -p /tmp/zt/src /tmp/zt/out
          echo "=== mkdir ===" > $L
          ios=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "=== ios sdk = $ios ===" >> $L

          python3 - <<'PY' 2>>$L
          import os
          os.makedirs('/tmp/zt/src', exist_ok=True)
          for name, size in [('small.bin', 4096),
                             ('mid.bin', 512*1024),
                             ('big.bin', 3*1024*1024)]:
              with open(f'/tmp/zt/src/{name}','wb') as f:
                  f.write(os.urandom(size))
          # 随机数据 zip 会"stored"或"deflated 0%"，这条才是真能压下去的，走 inflate
          with open('/tmp/zt/src/textible.txt','w') as f:
              f.write('MEANVC 中文声音克隆 onnx 权重头 ' * 60000)
          PY
          echo "=== python rc=$? ===" >> $L

          (cd /tmp/zt/src && zip -r ../test.zip .) >> $L 2>&1
          echo "=== zip rc=$? ===" >> $L
          ls -l /tmp/zt/test.zip >> $L 2>&1
          unzip -l /tmp/zt/test.zip >> $L 2>&1

          cat > /tmp/zt/main.swift <<'SW'
          import Foundation
          let zipURL = URL(fileURLWithPath: CommandLine.arguments[1])
          let outDir = URL(fileURLWithPath: CommandLine.arguments[2])
          do {
              let es = try ZipExtractor.readEntries(zipURL: zipURL)
              for e in es.sorted(by: { $0.filename < $1.filename }) {
                  print("ENT \(e.filename) method=\(e.compressionMethod) c=\(e.compressedSize) u=\(e.uncompressedSize)")
              }
              try ZipExtractor.extractAll(zipURL: zipURL, to: outDir)
              let files = try FileManager.default.contentsOfDirectory(atPath: outDir.path)
              for f in files.sorted() {
                  let p = outDir.appendingPathComponent(f).path
                  let s = ((try? FileManager.default.attributesOfItem(atPath: p))?[.size] as? NSNumber)?.int64Value ?? -1
                  print("OK \(f) \(s)")
              }
          } catch {
              FileHandle.standardError.write("FAIL \(error.localizedDescription)\n".data(using: .utf8)!)
              exit(2)
          }
          SW
          echo "=== main.swift 写了 ===" >> $L

          ZS="$GITHUB_WORKSPACE/app/SourcesVoice/ZipExtractor.swift"

          # 关键：按 iphoneos SDK 静态检查。上一版 macOS 编得过、iOS 编不过，就是这个洞
          swiftc -typecheck -sdk "$ios" -target arm64-apple-ios15.0 \
            "$ZS" /tmp/zt/main.swift >> $L 2>&1
          echo "=== iOS typecheck rc=$? ===" >> $L

          swiftc -O -o /tmp/zt/zip_test "$ZS" /tmp/zt/main.swift >> $L 2>&1
          echo "=== swiftc(macos) rc=$? ===" >> $L
          ls -l /tmp/zt/zip_test >> $L 2>&1

          /tmp/zt/zip_test /tmp/zt/test.zip /tmp/zt/out >> $L 2>&1
          echo "=== zip_test rc=$? ===" >> $L

          bad=0
          for f in small.bin mid.bin big.bin textible.txt; do
            if cmp -s /tmp/zt/src/$f /tmp/zt/out/$f; then
              echo "MATCH $f" >> $L
            else
              echo "DIFF  $f src=$(wc -c </tmp/zt/src/$f) out=$(wc -c </tmp/zt/out/$f 2>/dev/null || echo 缺)" >> $L
              bad=$((bad+1))
            fi
          done
          # 必须真有条目走了 inflate，否则这轮自检等于没测解压
          if grep -q "method=8" /tmp/zt/step.log; then
            echo "DEFLATE 路径测到了" >> $L
          else
            echo "没有 method=8 条目，inflate 分支未被覆盖" >> $L
            bad=$((bad+1))
          fi
          echo "=== bad=$bad ===" >> $L
          echo "ZT-BAD=$bad" >> $L

          # 自检恢复拦路：解压代码是下载后唯一的通路，坏包上机只是白折腾一次装机
          if [ "$bad" != "0" ]; then
            echo "ZipExtractor 自检没过，不出 IPA"
            exit 1
          fi

      - name: 装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: app
        run: |
          xcodegen generate --spec project-voice.yml 2>&1 | tee /tmp/gen.log
          xcodebuild -list -project Voice.xcodeproj 2>&1 | tee -a /tmp/gen.log

      - name: 构建 Voice.app
        run: |
          set -uo pipefail
          xcodebuild -project app/Voice.xcodeproj \
            -scheme Voice \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath /tmp/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee /tmp/build.log
          echo "构建退出码 ${PIPESTATUS[0]}" >> /tmp/build.log

      - name: 打包 IPA
        run: |
          set -e
          mkdir -p /tmp/ipa/Payload
          APP=$(find /tmp/derived/Build/Products/Release-iphoneos -name "Voice.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "找不到 Voice.app" > /tmp/pack.log
            find /tmp/derived/Build/Products -type d -maxdepth 3 >> /tmp/pack.log || true
            exit 1
          fi
          cp -R "$APP" /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -r /tmp/voice.ipa Payload > /tmp/pack.log
          ls -lh /tmp/voice.ipa >> /tmp/pack.log

      - name: 发编译日志（独立步骤，永远先发）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          cd /tmp
          { echo "### 自检 ZipExtractor（step.log）"; cat /tmp/zt/step.log 2>/dev/null || echo "(未跑或空)";
            echo; echo "### xcodegen"; cat /tmp/gen.log 2>/dev/null || echo "(空)";
            echo; echo "### SourcesVoice 清单"; ls -l "$GITHUB_WORKSPACE/app/SourcesVoice" 2>/dev/null || echo "(空)";
            echo; echo "### 编译错误（去重）";
            grep -E "error:" /tmp/build.log 2>/dev/null | sort -u | head -60 || true;
            echo; echo "### 第一个 error 的上下文";
            ln=$(grep -n -m1 "error:" /tmp/build.log 2>/dev/null | cut -d: -f1 || true);
            if [ -n "$ln" ]; then
              sed -n "$(( ln > 12 ? ln - 12 : 1 )),$(( ln + 12 ))p" /tmp/build.log;
            else
              echo "(没有 error: 行)";
            fi;
            echo; echo "### build.log 末尾";
            tail -120 /tmp/build.log 2>/dev/null || echo "(空)";
            echo; echo "### pack";
            cat /tmp/pack.log 2>/dev/null || echo "(空)"; } > voice-build.log
          echo "### commit $GITHUB_SHA / run $GITHUB_RUN_ID" >> voice-build.log
          ls -l /tmp/voice-build.log
          # cd /tmp 之后 gh 找不到 git remote，必须显式 --repo，否则每次都静默失败
          gh release delete voice-build-log --cleanup-tag -y --repo "$GITHUB_REPOSITORY" 2>&1 || true
          gh release create voice-build-log /tmp/voice-build.log \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "voice 构建日志" --prerelease \
            --notes "构建 xcodegen/xcodebuild 完整日志" 2>&1
          curl -sSI https://github.com/$GITHUB_REPOSITORY/releases/download/voice-build-log/voice-build.log | head -3

      - name: 发 IPA（独立步骤）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ ! -f /tmp/voice.ipa ]; then
            echo "没有 IPA，跳过发布"
            exit 0
          fi
          ls -lh /tmp/voice.ipa
          gh release delete channel-voice --cleanup-tag -y 2>&1 || true
          gh release create channel-voice /tmp/voice.ipa \
            --title "Voice IPA" --prerelease \
            --notes "Voice 声音克隆 app（LiveContainer 装载）" 2>&1
          curl -sSI https://github.com/$GITHUB_REPOSITORY/releases/download/channel-voice/voice.ipa | head -3
