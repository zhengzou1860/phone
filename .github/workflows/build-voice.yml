name: build-voice-ipa

on:
  push:
    branches: [voice]
    paths:
      - 'app/SourcesVoice/**'
      - 'app/project-voice.yml'
      - 'ci/voice_chain_gate.swift'
      - '.github/workflows/build-voice.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 自检 ZipExtractor（不通过不出包）
        run: |
          set +e          # GH Actions 默认 bash -e，一失败整块退出，日志就丢了
          L=/tmp/zt/step.log
          rm -rf /tmp/zt && mkdir -p /tmp/zt/src /tmp/zt/out
          echo "=== mkdir ===" > $L
          ios=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "=== ios sdk = $ios ===" >> $L

          python3 - <<'PY' 2>>$L
          import os
          os.makedirs('/tmp/zt/src', exist_ok=True)
          for name, size in [('small.bin', 4096),
                             ('mid.bin', 512*1024),
                             ('big.bin', 3*1024*1024)]:
              with open(f'/tmp/zt/src/{name}','wb') as f:
                  f.write(os.urandom(size))
          # 随机数据 zip 会"stored"或"deflated 0%"，这条才是真能压下去的，走 inflate
          with open('/tmp/zt/src/textible.txt','w') as f:
              f.write('MEANVC 中文声音克隆 onnx 权重头 ' * 60000)
          PY
          echo "=== python rc=$? ===" >> $L

          (cd /tmp/zt/src && zip -r ../test.zip .) >> $L 2>&1
          echo "=== zip rc=$? ===" >> $L
          ls -l /tmp/zt/test.zip >> $L 2>&1
          unzip -l /tmp/zt/test.zip >> $L 2>&1

          cat > /tmp/zt/main.swift <<'SW'
          import Foundation
          let zipURL = URL(fileURLWithPath: CommandLine.arguments[1])
          let outDir = URL(fileURLWithPath: CommandLine.arguments[2])
          do {
              let es = try ZipExtractor.readEntries(zipURL: zipURL)
              for e in es.sorted(by: { $0.filename < $1.filename }) {
                  print("ENT \(e.filename) method=\(e.compressionMethod) c=\(e.compressedSize) u=\(e.uncompressedSize)")
              }
              try ZipExtractor.extractAll(zipURL: zipURL, to: outDir)
              let files = try FileManager.default.contentsOfDirectory(atPath: outDir.path)
              for f in files.sorted() {
                  let p = outDir.appendingPathComponent(f).path
                  let s = ((try? FileManager.default.attributesOfItem(atPath: p))?[.size] as? NSNumber)?.int64Value ?? -1
                  print("OK \(f) \(s)")
              }
          } catch {
              FileHandle.standardError.write("FAIL \(error.localizedDescription)\n".data(using: .utf8)!)
              exit(2)
          }
          SW
          echo "=== main.swift 写了 ===" >> $L

          ZS="$GITHUB_WORKSPACE/app/SourcesVoice/ZipExtractor.swift"

          # 关键：按 iphoneos SDK 静态检查。上一版 macOS 编得过、iOS 编不过，就是这个洞
          swiftc -typecheck -sdk "$ios" -target arm64-apple-ios15.0 \
            "$ZS" /tmp/zt/main.swift >> $L 2>&1
          echo "=== iOS typecheck rc=$? ===" >> $L

          swiftc -O -o /tmp/zt/zip_test "$ZS" /tmp/zt/main.swift >> $L 2>&1
          echo "=== swiftc(macos) rc=$? ===" >> $L
          ls -l /tmp/zt/zip_test >> $L 2>&1

          /tmp/zt/zip_test /tmp/zt/test.zip /tmp/zt/out >> $L 2>&1
          echo "=== zip_test rc=$? ===" >> $L

          bad=0
          for f in small.bin mid.bin big.bin textible.txt; do
            if cmp -s /tmp/zt/src/$f /tmp/zt/out/$f; then
              echo "MATCH $f" >> $L
            else
              echo "DIFF  $f src=$(wc -c </tmp/zt/src/$f) out=$(wc -c </tmp/zt/out/$f 2>/dev/null || echo 缺)" >> $L
              bad=$((bad+1))
            fi
          done
          # 必须真有条目走了 inflate，否则这轮自检等于没测解压
          if grep -q "method=8" /tmp/zt/step.log; then
            echo "DEFLATE 路径测到了" >> $L
          else
            echo "没有 method=8 条目，inflate 分支未被覆盖" >> $L
            bad=$((bad+1))
          fi
          echo "=== bad=$bad ===" >> $L
          echo "ZT-BAD=$bad" >> $L

          # 自检恢复拦路：解压代码是下载后唯一的通路，坏包上机只是白折腾一次装机
          if [ "$bad" != "0" ]; then
            echo "ZipExtractor 自检没过，不出 IPA"
            exit 1
          fi

      - name: 自检 MelFrontEnd（Swift 数值对拍，不过不出包）
        run: |
          set +e
          L=/tmp/fe/step.log
          rm -rf /tmp/fe && mkdir -p /tmp/fe
          ios=$(xcrun --sdk iphoneos --show-sdk-path)
          FX="$GITHUB_WORKSPACE/app/SourcesVoice/Fixtures"
          { echo "=== swift version ==="; swiftc --version;
            echo "=== fixtures ==="; ls -l "$FX"; } > $L 2>&1

          cat > /tmp/fe/main.swift <<'SW'
          import Foundation

          // 和 MelFrontEnd.loadFloats 同一套读法，只是从命令行给的目录读（裸可执行文件没有 bundle）
          func floats(_ name: String) -> [Float]? {
              let url = URL(fileURLWithPath: CommandLine.arguments[1]).appendingPathComponent(name)
              guard let data = try? Data(contentsOf: url) else { return nil }
              let n = data.count / MemoryLayout<Float>.size
              guard n > 0 else { return nil }
              var out = [Float](repeating: 0, count: n)
              data.withUnsafeBytes { raw in
                  for i in 0..<n { out[i] = raw.loadUnaligned(fromByteOffset: i * 4, as: Float.self) }
              }
              return out
          }

          func maxAbs(_ a: [Float], _ b: [Float]) -> Float? {
              guard a.count == b.count, !a.isEmpty else { return nil }
              var m: Float = 0
              for i in 0..<a.count { let d = abs(a[i] - b[i]); if d > m { m = d } }
              return m
          }

          guard let wave = floats("synth16k_scaled.f32"),
                let expFB = floats("fbank_expect.f32"),
                let expPM = floats("pmel_expect.f32"),
                let basis = floats("librosa_mel_basis.f32") else {
              print("FAIL fixture 读不到"); exit(3)
          }
          var bad = 0
          let t0 = Date()
          let fb = MelFrontEnd.kaldiFbank(wave)
          let pm = MelFrontEnd.promptMel(wave.map { $0 / 32768.0 }, basis: basis)
          let ms = Int(Date().timeIntervalSince(t0) * 1000)
          if let d = maxAbs(fb, expFB) {
              print("FBANK frames=\(fb.count / 80) expect=\(expFB.count / 80) max_abs=\(String(format: "%.4g", d)) 用时\(ms)ms")
              if !(d < 5e-3) { bad += 1 }
          } else { print("FBANK 帧数对不上 got=\(fb.count) expect=\(expFB.count)"); bad += 1 }
          if let d = maxAbs(pm, expPM) {
              print("PMEL frames=\(pm.count / 80) expect=\(expPM.count / 80) max_abs=\(String(format: "%.4g", d))")
              if !(d < 5e-3) { bad += 1 }
          } else { print("PMEL 帧数对不上 got=\(pm.count) expect=\(expPM.count)"); bad += 1 }
          print("FE-BAD=\(bad)")
          exit(bad == 0 ? 0 : 2)
          SW
          echo "=== main.swift 写了 ===" >> $L

          swiftc -typecheck -sdk "$ios" -target arm64-apple-ios15.0 \
            "$GITHUB_WORKSPACE/app/SourcesVoice/MelFrontEnd.swift" >> $L 2>&1
          echo "=== iOS typecheck rc=$? ===" >> $L

          swiftc -O -o /tmp/fe/fe_test \
            "$GITHUB_WORKSPACE/app/SourcesVoice/MelFrontEnd.swift" /tmp/fe/main.swift >> $L 2>&1
          echo "=== swiftc(macos) rc=$? ===" >> $L

          /tmp/fe/fe_test "$FX" >> $L 2>&1
          echo "=== fe_test rc=$? ===" >> $L
          bad=$(grep -o 'FE-BAD=[0-9]*' /tmp/fe/step.log | tail -1 | cut -d= -f2)
          echo "=== bad=$bad ===" >> $L

          # 前端是整条链唯一的取数口，这里偏一个数量级，后面 700 MB 权重跑得再快也是废的
          if [ "$bad" != "0" ]; then
            echo "MelFrontEnd 数值自检没过，不出 IPA"
            exit 1
          fi

      - name: 取 ONNX Runtime（自留副本，逐字节校验）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release download ort-c-1.30.0 -p 'ort-c-1.30.0.zip' -D /tmp \
            --repo "$GITHUB_REPOSITORY"
          ls -l /tmp/ort-c-1.30.0.zip
          echo "e6f1670c14406fd9f082bb400ab197a9b0a9646058ca6366e440642e2b54a2ea  /tmp/ort-c-1.30.0.zip" \
            | shasum -a 256 -c -
          V="$GITHUB_WORKSPACE/app/Vendor"
          rm -rf "$V" && mkdir -p "$V"
          # 只解 iOS 真机那一片：simulator 和 macos 两片合起来比需要的多三倍
          unzip -q /tmp/ort-c-1.30.0.zip -d "$V" 'onnxruntime.xcframework/ios-arm64/*'
          F="$V/onnxruntime.xcframework/ios-arm64/onnxruntime.framework"
          test -s "$F/onnxruntime"
          test -s "$F/Headers/onnxruntime_c_api.h"
          ls -l "$F"
          du -sh "$V"

      - name: 自检 OrtShim + Swift 互操作（只出诊断，不拦路）
        run: |
          set +e          # 这一格报错和后面 xcodebuild 是同一批错，权威闸门在 xcodebuild
          L=/tmp/ot/step.log
          rm -rf /tmp/ot && mkdir -p /tmp/ot
          ios=$(xcrun --sdk iphoneos --show-sdk-path)
          SV="$GITHUB_WORKSPACE/app/SourcesVoice"
          HD="$GITHUB_WORKSPACE/app/Vendor/onnxruntime.xcframework/ios-arm64/onnxruntime.framework/Headers"
          T=arm64-apple-ios18.0
          { echo "=== ios sdk = $ios ==="; echo "=== headers ==="; ls "$HD" | head -5; } > $L 2>&1

          # 本机没有 clang，OrtShim.c 这辈子只有 CI 编得动；先单独编它，
          # 报错就是纯 C 的，不会被 Swift 的诊断盖住。
          xcrun --sdk iphoneos clang -c -std=gnu17 -O2 -Wall -Wextra \
            -target $T -isysroot "$ios" -I "$HD" -I "$SV" \
            "$SV/OrtShim.c" -o /tmp/ot/OrtShim.o >> $L 2>&1
          echo "=== clang rc=$? ===" >> $L
          ls -l /tmp/ot/OrtShim.o >> $L 2>&1
          echo "=== OrtShim.o 里待 force_load 解析的符号 ===" >> $L
          nm -u /tmp/ot/OrtShim.o >> $L 2>&1

          # Swift 侧：bridging header 真导得进来、Ort.swift 那些 C 指针写法真过得了类型。
          # swiftc 不认 -isysroot（上一轮就是 "unknown argument: '-isysroot'" rc=1，等于没测），
          # 只用 -sdk；-Xcc -I 才是给 clang 导入器的头文件搜索路径。
          xcrun --sdk iphoneos swiftc -typecheck -target $T -sdk "$ios" \
            -import-objc-header "$SV/Voice-Bridging-Header.h" \
            -Xcc -I -Xcc "$HD" \
            "$SV"/*.swift > /tmp/ot/swift.log 2>&1
          echo "=== swiftc typecheck rc=$? ===" >> $L
          echo "=== error（去重，最多 40 条）===" >> $L
          grep -E "error:" /tmp/ot/swift.log | sort -u | head -40 >> $L 2>&1
          grep -c "error:" /tmp/ot/swift.log > /tmp/ot/errcount.txt 2>&1
          echo "=== error 条数 $(cat /tmp/ot/errcount.txt) ===" >> $L
          cat $L

      - name: 装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: app
        run: |
          xcodegen generate --spec project-voice.yml 2>&1 | tee /tmp/gen.log
          xcodebuild -list -project Voice.xcodeproj 2>&1 | tee -a /tmp/gen.log

      - name: 构建 Voice.app
        run: |
          set -uo pipefail
          xcodebuild -project app/Voice.xcodeproj \
            -scheme Voice \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath /tmp/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee /tmp/build.log
          echo "构建退出码 ${PIPESTATUS[0]}" >> /tmp/build.log

      - name: 打包 IPA
        run: |
          set -e
          mkdir -p /tmp/ipa/Payload
          APP=$(find /tmp/derived/Build/Products/Release-iphoneos -name "Voice.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "找不到 Voice.app" > /tmp/pack.log
            find /tmp/derived/Build/Products -type d -maxdepth 3 >> /tmp/pack.log || true
            exit 1
          fi
          cp -R "$APP" /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -r /tmp/voice.ipa Payload > /tmp/pack.log
          ls -lh /tmp/voice.ipa >> /tmp/pack.log

      - name: 发编译日志（独立步骤，永远先发）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          cd /tmp
          { echo "### 自检 ZipExtractor（step.log）"; cat /tmp/zt/step.log 2>/dev/null || echo "(未跑或空)";
            echo; echo "### 自检 MelFrontEnd（step.log）"; cat /tmp/fe/step.log 2>/dev/null || echo "(未跑或空)";
            echo; echo "### 自检 OrtShim + Swift 互操作（step.log）"; cat /tmp/ot/step.log 2>/dev/null || echo "(未跑或空)";
            echo; echo "### vendored ONNX Runtime";
            find "$GITHUB_WORKSPACE/app/Vendor" -maxdepth 4 2>/dev/null | head -20 || echo "(app/Vendor 不存在 = 取包那步没跑)";
            du -sh "$GITHUB_WORKSPACE/app/Vendor" 2>/dev/null || true;
            echo; echo "### xcodegen"; cat /tmp/gen.log 2>/dev/null || echo "(空)";
            echo; echo "### SourcesVoice 清单"; ls -l "$GITHUB_WORKSPACE/app/SourcesVoice" 2>/dev/null || echo "(空)";
            echo; echo "### 编译错误（去重）";
            grep -E "error:" /tmp/build.log 2>/dev/null | sort -u | head -60 || true;
            echo; echo "### 链接问题（ld 的报错不带 error:，单独捞）";
            grep -A 25 "Undefined symbols" /tmp/build.log 2>/dev/null | head -60 || true;
            grep -E "^ld: |ld64|clang: error|missing required architecture|building file list" /tmp/build.log 2>/dev/null | sort -u | head -20 || true;
            echo "(上面两段都空 = 没走到链接或链接干净)";
            echo; echo "### 产物体积";
            find /tmp/derived/Build/Products -name "Voice" -type f -exec ls -lh {} \; 2>/dev/null || echo "(还没编出来)";
            echo; echo "### 第一个 error 的上下文";
            ln=$(grep -n -m1 "error:" /tmp/build.log 2>/dev/null | cut -d: -f1 || true);
            if [ -n "$ln" ]; then
              sed -n "$(( ln > 12 ? ln - 12 : 1 )),$(( ln + 12 ))p" /tmp/build.log;
            else
              echo "(没有 error: 行)";
            fi;
            echo; echo "### build.log 末尾";
            tail -120 /tmp/build.log 2>/dev/null || echo "(空)";
            echo; echo "### pack";
            cat /tmp/pack.log 2>/dev/null || echo "(空)"; } > voice-build.log
          echo "### commit $GITHUB_SHA / run $GITHUB_RUN_ID" >> voice-build.log
          ls -l /tmp/voice-build.log
          # cd /tmp 之后 gh 找不到 git remote，必须显式 --repo，否则每次都静默失败
          gh release delete voice-build-log --cleanup-tag -y --repo "$GITHUB_REPOSITORY" 2>&1 || true
          gh release create voice-build-log /tmp/voice-build.log \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "voice 构建日志" --prerelease \
            --notes "构建 xcodegen/xcodebuild 完整日志" 2>&1
          curl -sSI https://github.com/$GITHUB_REPOSITORY/releases/download/voice-build-log/voice-build.log | head -3

      - name: 发 IPA（独立步骤）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ ! -f /tmp/voice.ipa ]; then
            echo "没有 IPA，跳过发布"
            exit 0
          fi
          ls -lh /tmp/voice.ipa
          gh release delete channel-voice --cleanup-tag -y 2>&1 || true
          gh release create channel-voice /tmp/voice.ipa \
            --title "Voice IPA" --prerelease \
            --notes "Voice 声音克隆 app（LiveContainer 装载）" 2>&1
          curl -sSI https://github.com/$GITHUB_REPOSITORY/releases/download/channel-voice/voice.ipa | head -3

  chain-gate:
    # 整链数值对拍，独立一个 job：它要下 609 MB 权重、把 12 张图真跑一遍，
    # 和「出包」这件事互不拖累 —— 这一格红了照样发 IPA（明天装机靠的是 IPA），
    # IPA 那格炸了也不影响这里读数。日志发到自己名下的 release，不碰 channel-voice。
    name: 整链数值对拍（macOS 直跑 12 张图）
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 取 ONNX Runtime 的 macOS 片（同一个校验过的 zip）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release download ort-c-1.30.0 -p 'ort-c-1.30.0.zip' -D /tmp \
            --repo "$GITHUB_REPOSITORY"
          ls -l /tmp/ort-c-1.30.0.zip
          echo "e6f1670c14406fd9f082bb400ab197a9b0a9646058ca6366e440642e2b54a2ea  /tmp/ort-c-1.30.0.zip" \
            | shasum -a 256 -c -
          rm -rf /tmp/ortmac && mkdir -p /tmp/ortmac
          unzip -q /tmp/ort-c-1.30.0.zip -d /tmp/ortmac 'onnxruntime.xcframework/macos-arm64_x86_64/*'
          # macOS 的真身在 Versions/A/ 下面；framework 根上那个同名文件是一条 28 字节的
          # 软链文本（python 打的包会把它落成普通文件），拿去 -force_load 只会报一句看不懂的话。
          BIN=/tmp/ortmac/onnxruntime.xcframework/macos-arm64_x86_64/onnxruntime.framework/Versions/A/onnxruntime
          HD=/tmp/ortmac/onnxruntime.xcframework/macos-arm64_x86_64/onnxruntime.framework/Versions/A/Headers
          test -s "$BIN"
          test -s "$HD/onnxruntime_c_api.h"
          { echo "=== file ==="; file "$BIN"; echo "=== size ==="; ls -l "$BIN";
            echo "=== 头文件 ==="; ls "$HD" | head -5; } 2>&1
          echo "ORT_BIN=$BIN" >> $GITHUB_ENV
          echo "ORT_HD=$HD" >> $GITHUB_ENV

      - name: 取 fp16 权重（609 MB / 12 张图，逐字节校验）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release download voice-models -p 'models-fp16.zip' -D /tmp \
            --repo "$GITHUB_REPOSITORY"
          ls -l /tmp/models-fp16.zip
          echo "6304efb1444d2b76210ee0d001fcf60393bd09e7cef27f7673ef62ca278450a4  /tmp/models-fp16.zip" \
            | shasum -a 256 -c -
          rm -rf /tmp/models && mkdir -p /tmp/models
          # 条目全在 zip 根目录（和手机端 ModelManager 探测 Documents/voice_models/*.onnx 同一口径）
          unzip -q /tmp/models-fp16.zip -d /tmp/models
          ls -l /tmp/models
          test -s /tmp/models/sv_dynamic_len.onnx
          test -s /tmp/models/dit_state_6.onnx

      - name: 编闸门可执行文件
        run: |
          set +e
          rm -rf /tmp/gate && mkdir -p /tmp/gate
          L=/tmp/gate/step.log
          SV="$GITHUB_WORKSPACE/app/SourcesVoice"
          { echo "=== swift ==="; swiftc --version;
            echo "=== sdk ==="; xcrun --show-sdk-path;
            echo "=== 参与编译的 Swift ==="; ls -l "$SV"; } > $L 2>&1
          # 顶层语句只能待在 main.swift 里，所以从仓库里那份复制过去
          cp "$GITHUB_WORKSPACE/ci/voice_chain_gate.swift" /tmp/gate/main.swift

          xcrun clang -c -std=gnu17 -O2 -Wall -Wextra -target arm64-apple-macos14.0 \
            -I "$ORT_HD" -I "$SV" \
            "$SV/OrtShim.c" -o /tmp/gate/OrtShim.o >> $L 2>&1
          echo "=== clang rc=$? ===" >> $L
          nm -u /tmp/gate/OrtShim.o >> $L 2>&1

          xcrun swiftc -O -target arm64-apple-macos14.0 \
            -import-objc-header "$SV/Voice-Bridging-Header.h" \
            -Xcc -I -Xcc "$ORT_HD" \
            "$SV/MelFrontEnd.swift" "$SV/AudioProcessor.swift" \
            "$SV/Ort.swift" "$SV/ChainDriver.swift" \
            /tmp/gate/main.swift /tmp/gate/OrtShim.o \
            -Xlinker -force_load -Xlinker "$ORT_BIN" \
            -Xlinker -lc++ \
            -Xlinker -framework -Xlinker Accelerate \
            -Xlinker -framework -Xlinker Network \
            -Xlinker -framework -Xlinker CoreML \
            -o /tmp/gate/chain_gate >> $L 2>&1
          echo "=== swiftc rc=$? ===" >> $L
          ls -l /tmp/gate/chain_gate >> $L 2>&1
          echo "=== error（去重，最多 40 条）===" >> $L
          grep -E "error:" $L | sort -u | head -40 >> $L 2>&1
          cat $L
          if [ ! -x /tmp/gate/chain_gate ]; then
            echo "闸门可执行文件没编出来，见上一步日志"
            exit 1
          fi

      - name: 跑整链数值对拍
        run: |
          set +e
          FX="$GITHUB_WORKSPACE/app/SourcesVoice/Fixtures"
          /tmp/gate/chain_gate --models /tmp/models --fixtures "$FX" > /tmp/gate/run.log 2>&1
          rc=$?
          echo "=== chain_gate rc=$rc ===" >> /tmp/gate/run.log
          cat /tmp/gate/run.log
          echo "GATE_RC=$rc" >> $GITHUB_ENV
          # 首轮阈放开得宽（rel_max 0.2 / cos 0.99）：python 那边是 onnxruntime 1.19.2、
          # 这里链的是 1.30.0，同图不同版本的 kernel 本来就有残差。跑完按每段印的
          # SUGGEST 行收紧，别凭手感定数。结构错（通道序、图选错、少喂 cache）会当场红。
          if [ "$rc" != "0" ]; then
            echo "数值对拍不过（rc=$rc）—— IPA 那格不受影响，但这一格不许当没看见"
          fi
          exit "$rc"

      - name: 发对拍日志
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          cd /tmp
          { echo "### commit $GITHUB_SHA / run $GITHUB_RUN_ID / chain_gate rc=${GATE_RC:-未跑到}";
            echo; echo "### 编译（step.log）"; cat /tmp/gate/step.log 2>/dev/null || echo "(空)";
            echo; echo "### 对拍（run.log）"; cat /tmp/gate/run.log 2>/dev/null || echo "(空)";
            echo; echo "### 权重目录"; ls -l /tmp/models 2>/dev/null || echo "(没取到)";
            echo; echo "### vendored ORT"; ls -l "$(cat /tmp/gate/step.log 2>/dev/null | grep -o '/tmp/ortmac[^ ]*Versions/A/onnxruntime' | head -1)" 2>/dev/null || echo "(没取到)"; } > voice-chain-gate.log
          ls -l /tmp/voice-chain-gate.log
          # cd /tmp 之后 gh 找不到 git remote，必须显式 --repo
          gh release delete voice-chain-gate --cleanup-tag -y --repo "$GITHUB_REPOSITORY" 2>&1 || true
          gh release create voice-chain-gate /tmp/voice-chain-gate.log \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "voice 整链对拍日志" --prerelease \
            --notes "ChainDriver 逐段和 python 参考链的数值差" 2>&1
          curl -sSI https://github.com/$GITHUB_REPOSITORY/releases/download/voice-chain-gate/voice-chain-gate.log | head -3
