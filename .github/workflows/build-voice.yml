name: build-voice-ipa

on:
  push:
    branches: [voice]
    paths:
      - 'app/SourcesVoice/**'
      - 'app/project-voice.yml'
      - '.github/workflows/build-voice.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: app
        run: |
          xcodegen generate --spec project-voice.yml
          xcodebuild -list -project Voice.xcodeproj

      - name: 构建 Voice.app
        run: |
          set -uo pipefail
          xcodebuild -project app/Voice.xcodeproj \
            -scheme Voice \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath /tmp/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: 打包 IPA
        run: |
          set -e
          mkdir -p /tmp/ipa/Payload
          APP=$(find /tmp/derived/Build/Products/Release-iphoneos -name "Voice.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "找不到 Voice.app，列出构建产物："
            find /tmp/derived/Build/Products -type d -maxdepth 3 || true
            exit 1
          fi
          cp -R "$APP" /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -r /tmp/voice.ipa Payload
          ls -lh /tmp/voice.ipa

      - name: 发到固定 release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete channel-voice --cleanup-tag -y >/dev/null 2>&1 || true
          if [ -f /tmp/voice.ipa ]; then
            gh release create channel-voice /tmp/voice.ipa \
              --title "Voice IPA" --prerelease \
              --notes "Voice 声音克隆 app（LiveContainer 装载）"
            echo "IPA 已发布到 channel-voice"
          else
            echo "IPA 没构建出来，跳过发布"
            gh release create channel-voice \
              --title "Voice IPA（构建失败）" --prerelease \
              --notes "构建失败，无 IPA 产出" || true
          fi
