name: build-live-ipa

# 换脸推流这条线（手机出帧 → PC 算 → 页面看结果）自己的分支、自己的发布位。
# 剪辑那份 build.yml 是「push 到 main 就触发」且没有 paths 过滤 ⇒ 任何东西都不往 main 推。
# 要重跑：本机 gh 没登录，走 git push。空提交不算——下面有 paths 过滤，一个文件都没改就不匹配；
# 要么改这四条路径里的任一个（在本文件加一行注释也算），要么在仓库页上手动 workflow_dispatch。
on:
  push:
    branches: [live]
    paths:
      - 'app/SourcesLive/**'
      - 'app/project-live.yml'
      - 'ci/liveselftest/**'
      - '.github/workflows/build-live.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  live:
    runs-on: macos-latest
    # 没有模型要转，只有编码通路和纯逻辑要跑：30 分钟够到顶
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: show toolchain
        run: sw_vers && xcodebuild -version && xcodebuild -showsdks | grep -i ios

      # 本机是 Windows，一套 Swift 都没被真编译器碰过。出包前先在 mac 上跑三件事：
      # ① vImage+ImageIO 那条编码通路真出得出 JPEG（这是手机上行带宽的命门）；
      # ② 地址/跳转/抽帧这几段纯逻辑判一遍；
      # ③ 注入脚本里的挂子名和 Swift 分发器对账——对不上手机上就是「点了没反应」，最难查。
      # 跑不出 LIVE-VERDICT PASS 就不出包：那种包装到手机上只会连不上或白点。
      - name: 手机端自测（不过就不出包）
        run: |
          set -o pipefail
          rec() { tee -a /tmp/selftest.log; }
          touch /tmp/selftest.log /tmp/build.log
          # 0.21 的闪退根因：主线程 cancelReading() 和后台 copyNextSampleBuffer() 并发是
          # 未定义行为（实测 SIGSEGV，日志停在「用户点了停止」）。编译器和自测都看不出
          # 这种数据竞争，只能在这里挡：注释里可以提，代码里不许再出现这一行调用。
          if awk '{ line=$0; sub(/^[ \t]+/, "", line);
                    if (line !~ /^\/\// && line ~ /cancelReading[ \t]*\(/) { print FNR": "line; bad=1 } }
                  END { exit bad ? 0 : 1 }' app/SourcesLive/FrameSource.swift; then
            echo "LIVE-VERDICT FAIL FrameSource 又直接调了 cancelReading()：停止要作废代数、让读线程自己退" | rec
            exit 1
          fi
          # 作废通路缺一环，停止/跳转就会退回「主线程动 AVAssetReader」那条死路。
          for sym in beginGeneration invalidateGeneration isCurrent endGeneration sleepPacing; do
            grep -q "$sym" app/SourcesLive/FrameSource.swift || {
              echo "LIVE-VERDICT FAIL FrameSource 少了 $sym：停止/跳转的作废通路被删了" | rec
              exit 1
            }
          done
          xcrun swiftc -O \
            app/SourcesLive/LiveLogic.swift \
            app/SourcesLive/FrameSource.swift \
            app/SourcesLive/SwapClient.swift \
            app/SourcesLive/AppLog.swift \
            ci/liveselftest/main.swift \
            -o /tmp/livetest 2>&1 | rec
          if [ ! -x /tmp/livetest ]; then echo "LIVE-VERDICT FAIL 自测没编出来，见上面编译错" | rec; exit 1; fi
          /tmp/livetest 2>&1 | rec
          grep -q "^LIVE-VERDICT PASS" /tmp/selftest.log || { echo "上面每一条 FAIL 就是没过的判据" | rec; exit 1; }

      - name: install xcodegen
        run: |
          set -euo pipefail
          curl -sL -o /tmp/xg.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          rm -rf /tmp/xg && unzip -q /tmp/xg.zip -d /tmp/xg
          sudo /tmp/xg/xcodegen/install.sh
          xcodegen --version

      - name: generate project
        working-directory: app
        run: xcodegen --spec project-live.yml

      - name: build
        working-directory: app
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -project LiveSwap.xcodeproj -scheme LiveSwap \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= EXPANDED_CODE_SIGN_IDENTITY= \
            build 2>&1 | tee -a /tmp/build.log

      # 界面上看到的字全来自 PC 那份页面，手机这边只有一行是真属于自己的：
      # ATS 和本地网络授权这两条没进 Info.plist，手机就是「连不上」而且说不出原因。
      # 所以这里读包里的 plist，不读 yml 写了什么。
      - name: package ipa
        working-directory: app
        run: |
          set -euo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=8{print "::error::" p substr($0,1,230)}'; }
          rec() { tee -a /tmp/selftest.log; }
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          echo "built app: $APP" >> /tmp/build.log
          file "$APP/LiveSwap" | tee -a /tmp/build.log
          plutil -p "$APP/Info.plist" > /tmp/infoplist.txt 2>&1
          # 不用 `sed … | head -1`：pipefail 下 head 提前收管会给 sed 记一个 SIGPIPE 退出码，
          # 整条 step 就这么死在检查上。awk 自己 exit，单命令没有管子。
          pid=$(awk -F' => ' '/"CFBundleIdentifier"/{gsub(/"/,"",$2); print $2; exit}' /tmp/infoplist.txt)
          pver=$(awk -F' => ' '/"CFBundleShortVersionString"/{gsub(/"/,"",$2); print $2; exit}' /tmp/infoplist.txt)
          echo "I-VERDICT 包 id=$pid 版本=$pver" | rec
          { echo "I-VERDICT ATS放行=$(grep -c NSAppTransportSecurity /tmp/infoplist.txt)（要 ≥1，局域网 http 全靠它）"
            echo "I-VERDICT 本地网络描述=$(grep -c NSLocalNetworkUsageDescription /tmp/infoplist.txt)（要 ≥1，iOS14 起连 192.168.x.x 先过这道）"
            echo "I-VERDICT 任意加载=$(grep -c NSAllowsArbitraryLoads /tmp/infoplist.txt)"; } | rec | ann "I-VERDICT "
          # 包 id 缺了手机装不上、版本缺了分不清装的是哪一轮，这两条是闸门不是日志。
          if [ -z "$pid" ] || [ -z "$pver" ]; then
            echo "::error::I-VERDICT 包里的 Info.plist 读不出包 id 或版本（id=[$pid] 版本=[$pver]）——这包手机装不上，不出"
            exit 1
          fi
          rm -rf Payload live.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          ditto -c -k --keepParent Payload live.ipa
          ls -la live.ipa | tee -a /tmp/build.log

      - name: publish release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          cat /tmp/selftest.log /tmp/build.log > ./build.log 2>/dev/null || cp /tmp/build.log ./build.log
          echo "待发文件 [live.ipa build.log]" | ann "REL "
          # 不删了重发：删这一下下载位就出现空窗（99ffb71 那轮 CI 成功、包也造出来了，事后匿名读回 404）。
          gh release view channel-live >/dev/null 2>&1 || gh release create channel-live \
            --title "LiveSwap build" --prerelease --notes "CI artifact（占位，等 asset 上传）" 2>&1 | ann "REL "
          # 关键顺序：建 release 时一个文件都不带 ⇒ 建完就是已发布状态。
          # gh release create 带文件时是先建草稿、传完才发布，中途没走完就永久卡在草稿里。
          # 所以 asset 一律用 upload --clobber 传进这条已发布的 release。
          gh release upload channel-live live.ipa build.log --clobber 2>&1 | ann "REL "
          gh release edit channel-live --draft=false --prerelease >/dev/null 2>&1
          # REST 那条 PATCH 认数字 id；gh --json id 给的是 node_id（RE_kwDO…），拿它去 PATCH 是 404
          RID=$(gh release view channel-live --json databaseId --jq .databaseId 2>/dev/null)
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RID" \
            -d '{"draft":false,"prerelease":true,"tag_name":"channel-live","name":"LiveSwap build","body":"CI artifact for commit '"$GITHUB_SHA"'"}' \
            >/tmp/rel_patch.json 2>&1
          echo "R-PATCH id=$RID 回包=$(head -c 120 /tmp/rel_patch.json | tr -d '\n')" | ann "REL "
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/channel-live/live.ipa" | ann "REL "
          # 闸门三条同时满足才算数：isDraft=false（草稿 SideStore 拉不到）＋列到 live.ipa＋匿名 HEAD 回 200
          hit=0
          for i in 1 2 3; do
            draft=$(gh release view channel-live --json isDraft --jq .isDraft 2>&1)
            names=$(gh release view channel-live --json assets --jq '.assets[] | .name + "=" + (.size|tostring)' 2>&1 | tr '\n' ' ')
            anon=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 90 \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/channel-live/live.ipa" 2>/dev/null)
            echo "第 $i 次：isDraft=$draft｜匿名 HEAD ipa=$anon｜ [$names]" | ann "REL-GATE "
            if [ "$draft" = "false" ] && [ "$anon" = 200 ]; then
              case "$names" in *live.ipa*) hit=1 ;; esac
              [ "$hit" = 1 ] && break
            fi
            sleep 10
          done
          [ "$hit" = 1 ] || echo "::error::REL-GATE 三次都没同时满足「isDraft=false」+「列到 live.ipa」+「匿名 HEAD 回 200」⇒ 这一版手机上拿不到"
          if [ "$hit" = 1 ]; then exit 0; else exit 1; fi

      - name: report compile errors
        if: failure()
        working-directory: app
        run: |
          set +e
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=8{print "::error::" p substr($0,1,230)}'; }
          cat /tmp/selftest.log /tmp/build.log > ./build.log 2>/dev/null || cp /tmp/build.log ./build.log 2>/dev/null || echo "no build log at all" > ./build.log
          grep -nE "error:|fatal error:" ./build.log | ann "ERR "
          exit 0

      - name: report failure log
        if: failure()
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          cat /tmp/selftest.log /tmp/build.log > ./build.log 2>/dev/null || cp /tmp/build.log ./build.log 2>/dev/null || echo "no build log at all" > ./build.log
          echo "待发文件 [build.log]" | ann "GH-FAIL "
          gh release delete channel-live-fail --cleanup-tag -y >/dev/null 2>&1 || true
          # 上一轮删失败、或 release 还在但 asset 没了，create 会报 tag 已存在。
          # 看的是 gh 自己的退出码（PIPESTATUS[0]），不是 ann 的——ann 永远回 0。
          gh release create channel-live-fail build.log \
            --title "LiveSwap CI failed log" \
            --prerelease \
            --notes "no ipa this round" 2>&1 | ann "GH-FAIL "
          if [ "${PIPESTATUS[0]}" != "0" ]; then
            gh release upload channel-live-fail build.log --clobber 2>&1 | ann "GH-FAIL "
          fi
          exit 0
