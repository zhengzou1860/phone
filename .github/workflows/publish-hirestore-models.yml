name: publish-hirestore-models

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: hirestore-models
  cancel-in-progress: false

jobs:
  gfpgan:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: select current iOS toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
          xcrun coremlcompiler compile --help

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install conversion tools
        run: python -m pip install --disable-pip-version-check 'torch==2.7.0' 'torchvision==0.22.0' 'coremltools==9.0' pillow numpy 'scikit-learn<1.6'

      - name: fetch pinned GFPGAN architecture
        uses: actions/checkout@v4
        with:
          repository: TencentARC/GFPGAN
          ref: 7552a7791caad982045a7bbe5634bbf1cd5c8679
          path: upstream-gfpgan

      - name: download GFPGAN v1.4 weights
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 3 \
            https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.4.pth \
            -o /tmp/GFPGANv1.4.pth
          test "$(wc -c < /tmp/GFPGANv1.4.pth | tr -d ' ')" -gt 300000000

      - name: convert and numerically validate GFPGAN
        run: |
          set -euo pipefail
          python tools/convert_gfpgan_mlprogram.py \
            --upstream "$GITHUB_WORKSPACE/upstream-gfpgan" \
            --weights /tmp/GFPGANv1.4.pth \
            --output /tmp/gfpgan-mlprogram.mlpackage \
            --manifest /tmp/gfpgan-manifest.json

      - name: compile and verify GFPGAN
        run: |
          set -euo pipefail
          rm -rf /tmp/gfpgan.mlmodelc /tmp/gfpgan-build
          mkdir -p /tmp/gfpgan-build
          xcrun coremlcompiler compile /tmp/gfpgan-mlprogram.mlpackage /tmp/gfpgan-build \
            --platform iOS --deployment-target 18.0
          shopt -s nullglob
          compiled=(/tmp/gfpgan-build/*.mlmodelc)
          test "${#compiled[@]}" -eq 1
          mv "${compiled[0]}" /tmp/gfpgan.mlmodelc
          python - <<'PY'
          from pathlib import Path
          source = Path("/tmp/gfpgan.mlmodelc")
          size = sum(path.stat().st_size for path in source.rglob("*") if path.is_file())
          if size > 160 * 1024 * 1024:
              raise SystemExit(f"compiled GFPGAN exceeds device budget: {size} bytes")
          print(f"GFPGAN-COMPILED-BYTES {size}")
          PY
          test -s /tmp/gfpgan.mlmodelc/coremldata.bin
          test -s /tmp/gfpgan.mlmodelc/model.mlmodel
          xcrun swiftc "$GITHUB_WORKSPACE/ci/verify_gfpgan.swift" -o /tmp/verify_gfpgan
          /tmp/verify_gfpgan /tmp/gfpgan.mlmodelc

      - name: verify GFPGAN on current iOS simulator
        run: |
          set -euo pipefail
          rm -rf /tmp/gfpgan-verify.app /tmp/gfpgan-verify-src
          mkdir -p /tmp/gfpgan-verify.app /tmp/gfpgan-verify-src
          cp -R /tmp/gfpgan.mlmodelc /tmp/gfpgan-verify.app/1.3.0-gfpgan.mlmodelc
          cp "$GITHUB_WORKSPACE/ci/verify_gfpgan.swift" /tmp/gfpgan-verify-src/main.swift
          simulator=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data["devices"].items():
              marker = "com.apple.CoreSimulator.SimRuntime.iOS-"
              if marker not in runtime:
                  continue
              version = runtime.split(marker, 1)[1].replace("-", ".")
              try:
                  order = tuple(int(part) for part in version.split("."))
              except ValueError:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((order, version, device["udid"]))
          if not candidates:
              raise SystemExit("no available iPhone simulator")
          _, version, udid = max(candidates)
          print(version, udid)
          ')
          read -r runtime_version device <<< "$simulator"
          python3 - "$runtime_version" <<'PY'
          import plistlib
          import sys
          info = {
              "CFBundleIdentifier": "com.qoder.gfpganverify",
              "CFBundleExecutable": "GFPGANVerify",
              "CFBundleName": "GFPGANVerify",
              "CFBundlePackageType": "APPL",
              "CFBundleSupportedPlatforms": ["iPhoneSimulator"],
              "CFBundleVersion": "1",
              "MinimumOSVersion": sys.argv[1],
              "LSRequiresIPhoneOS": True,
              "UIDeviceFamily": [1],
          }
          with open("/tmp/gfpgan-verify.app/Info.plist", "wb") as handle:
              plistlib.dump(info, handle)
          PY
          xcrun swiftc \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -target "arm64-apple-ios${runtime_version}-simulator" \
            /tmp/gfpgan-verify-src/main.swift \
            -o /tmp/gfpgan-verify.app/GFPGANVerify
          codesign --force --sign - /tmp/gfpgan-verify.app
          echo "GFPGAN simulator runtime iOS $runtime_version device $device"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" /tmp/gfpgan-verify.app
          container=$(xcrun simctl get_app_container "$device" com.qoder.gfpganverify app)
          set +e
          output=$(xcrun simctl spawn "$device" "$container/GFPGANVerify" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            xcrun simctl spawn "$device" log show --last 3m --style compact --predicate 'process == "GFPGANVerify"' || true
          fi
          test "$status" -eq 0
          grep -q '^GFPGAN-IOS-VERDICT PASS input=512x512 output=512x512$' <<< "$output"

      - name: package precompiled model
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          source = Path("/tmp/gfpgan.mlmodelc")
          archive = Path("/tmp/gfpgan-mlprogram.zip")
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_STORED, allowZip64=False) as handle:
              for path in sorted(source.rglob("*")):
                  handle.write(path, path.relative_to(source.parent).as_posix())
          digest = hashlib.sha256()
          with archive.open("rb") as handle:
              while chunk := handle.read(1024 * 1024):
                  digest.update(chunk)
          manifest_path = Path("/tmp/gfpgan-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["compiled"] = {
              "file": archive.name,
              "bytes": archive.stat().st_size,
              "sha256": digest.hexdigest(),
              "format": "mlmodelc-mlprogram",
              "archive": "zip-stored",
              "compiler": "Xcode 26.6",
              "minimumiOS": "18.0",
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("GFPGAN-COMPILED-PACKAGE", json.dumps(manifest["compiled"]))
          PY

      - name: fetch upstream license
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/TencentARC/GFPGAN/7552a7791caad982045a7bbe5634bbf1cd5c8679/LICENSE \
            -o /tmp/GFPGAN_LICENSE.txt
          test -s /tmp/GFPGAN_LICENSE.txt
          grep -q 'Apache License' /tmp/GFPGAN_LICENSE.txt

      - name: upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiRestore-GFPGAN-MLProgram-model
          path: |
            /tmp/gfpgan-mlprogram.mlpackage
            /tmp/gfpgan-mlprogram.zip
            /tmp/gfpgan-manifest.json
            /tmp/GFPGAN_LICENSE.txt
          if-no-files-found: error
          retention-days: 30

      - name: publish model release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view channel-hirestore-models >/dev/null 2>&1; then
            gh release create channel-hirestore-models \
              --title 'HiRestore offline models' --prerelease \
              --notes 'Verified offline model assets for HiRestore.'
          fi
          gh release upload channel-hirestore-models \
            /tmp/gfpgan-mlprogram.zip /tmp/gfpgan-manifest.json /tmp/GFPGAN_LICENSE.txt \
            --clobber
          gh release edit channel-hirestore-models \
            --draft=false --prerelease \
            --notes 'GFPGAN v1.4 ML Program with FP32 compute and 6-bit weight palettization, converted from TencentARC/GFPGAN and numerically validated against PyTorch; compiled with Xcode 26.6 and verified on macOS plus the current iOS simulator. Upstream Apache-2.0.'
          expected=$(python -c 'import json; print(json.load(open("/tmp/gfpgan-manifest.json"))["compiled"]["bytes"])')
          actual=$(gh release view channel-hirestore-models --json assets \
            --jq '.assets[] | select(.name=="gfpgan-mlprogram.zip") | .size')
          test "$actual" = "$expected"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/channel-hirestore-models/gfpgan-mlprogram.zip"
          code=$(curl -fsSIL -o /dev/null -w '%{http_code}' --max-time 90 "$url")
          test "$code" = 200
          echo "GFPGAN-RELEASE-VERDICT PASS bytes=$actual url=$url"
