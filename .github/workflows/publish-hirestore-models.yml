name: publish-hirestore-models

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: hirestore-models
  cancel-in-progress: false

jobs:
  gfpgan:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: inspect Core ML compiler
        run: xcrun coremlcompiler compile --help

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install model tools
        run: python -m pip install --disable-pip-version-check 'gdown==5.2.0' 'coremltools==9.0'

      - name: download and inspect GFPGAN
        run: |
          set -euo pipefail
          python tools/prepare_gfpgan.py \
            --output /tmp/gfpgan.mlmodel \
            --manifest /tmp/gfpgan-manifest.json

      - name: compile and verify GFPGAN
        run: |
          set -euo pipefail
          rm -rf /tmp/gfpgan.mlmodelc
          xcrun coremlcompiler compile /tmp/gfpgan.mlmodel /tmp \
            --deployment-target 18.0 --platform ios
          test -s /tmp/gfpgan.mlmodelc/model.mil
          test -s /tmp/gfpgan.mlmodelc/coremldata.bin
          xcrun swiftc "$GITHUB_WORKSPACE/ci/verify_gfpgan.swift" -o /tmp/verify_gfpgan
          /tmp/verify_gfpgan /tmp/gfpgan.mlmodelc

      - name: package precompiled model
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          source = Path("/tmp/gfpgan.mlmodelc")
          archive = Path("/tmp/gfpgan-ios18.zip")
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_STORED, allowZip64=False) as handle:
              for path in sorted(source.rglob("*")):
                  handle.write(path, path.relative_to(source.parent).as_posix())
          digest = hashlib.sha256()
          with archive.open("rb") as handle:
              while chunk := handle.read(1024 * 1024):
                  digest.update(chunk)
          manifest_path = Path("/tmp/gfpgan-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["compiled"] = {
              "file": archive.name,
              "bytes": archive.stat().st_size,
              "sha256": digest.hexdigest(),
              "format": "mlmodelc",
              "archive": "zip-stored",
              "minimumiOS": "18.0",
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("GFPGAN-COMPILED-PACKAGE", json.dumps(manifest["compiled"]))
          PY

      - name: fetch upstream license
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/TencentARC/GFPGAN/master/LICENSE \
            -o /tmp/GFPGAN_LICENSE.txt
          test -s /tmp/GFPGAN_LICENSE.txt
          grep -q 'Apache License' /tmp/GFPGAN_LICENSE.txt

      - name: upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiRestore-GFPGAN-model
          path: |
            /tmp/gfpgan.mlmodel
            /tmp/gfpgan-ios18.zip
            /tmp/gfpgan-manifest.json
            /tmp/GFPGAN_LICENSE.txt
          if-no-files-found: error
          retention-days: 30

      - name: publish model release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view channel-hirestore-models >/dev/null 2>&1; then
            gh release create channel-hirestore-models \
              --title 'HiRestore offline models' --prerelease \
              --notes 'Verified offline model assets for HiRestore.'
          fi
          gh release upload channel-hirestore-models \
            /tmp/gfpgan.mlmodel /tmp/gfpgan-ios18.zip /tmp/gfpgan-manifest.json /tmp/GFPGAN_LICENSE.txt \
            --clobber
          gh release edit channel-hirestore-models \
            --draft=false --prerelease \
            --notes 'GFPGAN Core ML model converted by john-rocky/CoreML-Models; precompiled iOS package verified on macOS; upstream TencentARC/GFPGAN, Apache-2.0.'
          expected=$(python -c 'import json; print(json.load(open("/tmp/gfpgan-manifest.json"))["bytes"])')
          actual=$(gh release view channel-hirestore-models --json assets \
            --jq '.assets[] | select(.name=="gfpgan.mlmodel") | .size')
          test "$actual" = "$expected"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/channel-hirestore-models/gfpgan.mlmodel"
          code=$(curl -fsSIL -o /dev/null -w '%{http_code}' --max-time 90 "$url")
          test "$code" = 200
          compiled=$(python -c 'import json; print(json.load(open("/tmp/gfpgan-manifest.json"))["compiled"]["bytes"])')
          compiled_actual=$(gh release view channel-hirestore-models --json assets \
            --jq '.assets[] | select(.name=="gfpgan-ios18.zip") | .size')
          test "$compiled_actual" = "$compiled"
          compiled_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/channel-hirestore-models/gfpgan-ios18.zip"
          compiled_code=$(curl -fsSIL -o /dev/null -w '%{http_code}' --max-time 90 "$compiled_url")
          test "$compiled_code" = 200
          echo "GFPGAN-RELEASE-VERDICT PASS bytes=$actual compiled_bytes=$compiled_actual url=$compiled_url"
