name: build-unsigned-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipa
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: show toolchain
        run: sw_vers && xcodebuild -version && xcodebuild -showsdks | grep -i ios

      # 纯诊断：身份 API 到底在不在 SDK，不依赖手机端就能判
      - name: probe Vision SDK symbols
        continue-on-error: true
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=8{print "::error::" p substr($0,1,230)}'; }
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          FW="$SDK/System/Library/Frameworks/Vision.framework"
          { echo "sdk=$SDK"; echo "fw_dir=$([ -d "$FW" ] && echo 在 || echo 不在)"; ls "$FW" 2>&1 | head -10; } | ann "VIS-LS "
          find "$SDK" -name "Vision.tbd" -o -name "Vision.h" 2>/dev/null | head -4 | ann "VIS-FIND " || true
          grep -rhoE "VN[A-Za-z]*FeaturePrint[A-Za-z]*" "$FW" 2>/dev/null | sort -u | ann "VIS-SYM " || true
          grep -rhB2 -A6 "IdentityFeaturePrint" "$FW" 2>/dev/null | head -14 | ann "VIS-DECL " || true

      - name: install xcodegen
        run: |
          set -euo pipefail
          curl -sL -o /tmp/xg.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          rm -rf /tmp/xg && unzip -q /tmp/xg.zip -d /tmp/xg
          sudo /tmp/xg/xcodegen/install.sh
          xcodegen --version

      - name: generate project
        working-directory: app
        run: xcodegen --spec project.yml

      - name: build
        working-directory: app
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -project HelloLC.xcodeproj -scheme HelloLC \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= EXPANDED_CODE_SIGN_IDENTITY= \
            build 2>&1 | tee /tmp/build.log

      - name: package ipa
        working-directory: app
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          echo "built app: $APP" >> /tmp/build.log
          file "$APP/HelloLC" | tee -a /tmp/build.log
          rm -rf Payload hello.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          ditto -c -k --keepParent Payload hello.ipa
          ls -la hello.ipa | tee -a /tmp/build.log

      # 每个 step 的 annotation 有独立额度，诊断按 step 拆开，别堆在一个 step 里被截断
      - name: publish release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          cp /tmp/build.log ./build.log
          gh release delete channel-test --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create channel-test hello.ipa build.log \
            --title "HelloLC build" \
            --prerelease \
            --notes "CI artifact for commit $GITHUB_SHA" 2>&1 | ann "REL "
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/channel-test/hello.ipa" | ann "REL "

      - name: report compile errors
        if: failure()
        working-directory: app
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=8{print "::error::" p substr($0,1,230)}'; }
          cp /tmp/build.log ./build.log 2>/dev/null || echo "no build log at all" > ./build.log
          grep -nE "error:|fatal error:" ./build.log | ann "ERR "

      - name: report release failure
        if: failure()
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          cp /tmp/build.log ./build.log 2>/dev/null || echo "no build log at all" > ./build.log
          gh release delete channel-test --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create channel-test build.log \
            --title "CI failed log" \
            --prerelease \
            --notes "no ipa this round" 2>&1 | ann "GH-FAIL "

  # 独立 job：苹果的工具链认不认 insightface 的小模型，跟出 IPA 互不影响
  coreml:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install coremltools
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          pip install --no-cache-dir coremltools onnx numpy 2>&1 | tail -3 | ann "PIP "
          python -c "import coremltools as ct; print('coremltools', ct.__version__)" 2>&1 | ann "PIP-VER "

      - name: fetch onnx
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          code=$(curl -fsL --retry 3 --max-time 300 -o /tmp/sc.zip -w "%{http_code}" \
            https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_sc.zip)
          { echo "http=$code bytes=$(wc -c < /tmp/sc.zip 2>/dev/null)"; file /tmp/sc.zip; } | ann "GET " || true
          rm -rf /tmp/sc && mkdir -p /tmp/sc
          unzip -o -q /tmp/sc.zip -d /tmp/sc 2>&1 | ann "UNZ " || echo "unzip 失败" | ann "UNZ "
          ls -la /tmp/sc | ann "UNZ " || true
          test -s /tmp/sc/w600k_mbf.onnx

      - name: convert
        run: |
          set +e          # GitHub 的 run 步默认是 bash -eo pipefail，不显式关掉就一步错、后面全不执行
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=8{print "::error::" p substr($0,1,230)}'; }
          echo "步骤已开始，errexit 已关" | ann "CV0 "
          python - > /tmp/conv.log 2>&1 <<'PY'
          import traceback

          def brief(e):
              return "%s: %s" % (type(e).__name__, " ".join(str(e).split())[:260])

          try:
              import coremltools as ct
              print("CT-VER", ct.__version__)
          except Exception as e:
              print("CT-IMPORT-FAIL", brief(e))
              raise SystemExit(0)

          src = "/tmp/sc/w600k_mbf.onnx"
          try:
              import onnx
              g = onnx.load(src)
              print("ONNX-OK nodes=%d ir=%d opset=%s" % (
                  len(g.graph.node), g.ir_version,
                  ",".join("%s:%s" % (o.domain or "ai.onnx", o.version) for o in g.opset_import)))
          except Exception as e:
              print("ONNX-LOAD-FAIL", brief(e))

          cands = []
          for name in ("iOS18", "iOS15", "iOS13", "iOS12"):
              t = getattr(ct.target, name, None)
              if t is not None:
                  cands.append((name, t))
          cands.append(("legacy-nn", None))
          print("TRY-ORDER", ",".join(n for n, _ in cands))

          for label, target in cands:
              try:
                  kw = {} if target is None else {"minimum_deployment_target": target}
                  m = ct.convert(src, source="onnx", **kw)
                  out = "/tmp/mbf_%s" % label
                  m.save(out)
                  spec = m.get_spec().description
                  print("CONVERT-OK %s -> %s" % (label, out))
                  for i in spec.input:
                      print("  in", i.name, i.type, list(i.shape) if hasattr(i, "shape") else "")
                  for o in spec.output:
                      print("  out", o.name, o.type)
                  break
              except Exception as e:
                  print("CONVERT-FAIL %s %s" % (label, brief(e)))
                  traceback.print_exc()
          PY
          echo "conv.log 字节 $(wc -c < /tmp/conv.log)" | ann "CV1 "
          grep -E "^(CT-|ONNX-|TRY-|CONVERT-)" /tmp/conv.log | ann "CV2 "
          tail -6 /tmp/conv.log | ann "CV3 "
          ls -d /tmp/mbf_* 2>/dev/null | ann "CV4 "

      - name: keep artifact
        if: always()
        run: |
          set +e
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          cd /tmp && zip -r -q mbf_coreml.zip mbf_* 2>/dev/null
          ls -l /tmp/mbf_coreml.zip | ann "ART "

      - name: upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mbf-coreml
          path: /tmp/mbf_coreml.zip
          if-no-files-found: ignore
