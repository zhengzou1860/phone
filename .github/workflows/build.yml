name: build-unsigned-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipa
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: show toolchain
        run: sw_vers && xcodebuild -version && xcodebuild -showsdks | grep -i ios

      - name: 装 python 3.11（onnx2coreml 要 >=3.11）
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 尺子（w600k_mbf）转成 CoreML 落到 Sources 里，让 xcodebuild 把它编进包。
      # 转不出来也照样出包：app 自己的报告会写"包里没有模型"，那才是判据。
      - name: 把尺子转成 CoreML 塞进包
        run: |
          set +e
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          rm -rf /tmp/m2c /tmp/sc app/Sources/mbf.mlpackage && mkdir -p /tmp/sc
          python -m venv /tmp/m2c >/dev/null 2>&1
          /tmp/m2c/bin/pip install --quiet --no-cache-dir onnx2coreml coremltools onnx >/tmp/m2cpip.log 2>&1
          code=$(curl -fsL --retry 3 --max-time 300 -o /tmp/sc.zip -w "%{http_code}" \
            https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_sc.zip)
          echo "onnx 下载 http=$code bytes=$(wc -c < /tmp/sc.zip 2>/dev/null)" | ann "M-GET "
          unzip -o -q /tmp/sc.zip -d /tmp/sc 2>&1 | ann "M-UNZ "
          /tmp/m2c/bin/python ci/onnx_fix_shape.py /tmp/sc/w600k_mbf.onnx /tmp/sc/fixed.onnx 2>&1 | ann "M-FIX "
          /tmp/m2c/bin/onnx2coreml convert /tmp/sc/fixed.onnx -o app/Sources/mbf.mlpackage \
            --format mlpackage >/tmp/m2c.log 2>&1
          rc=$?
          if [ $rc -eq 0 ] && [ -d app/Sources/mbf.mlpackage ]; then
            echo "模型已进包 app/Sources/mbf.mlpackage $(du -sk app/Sources/mbf.mlpackage 2>/dev/null | awk '{print $1"KB"}')" | ann "M-VERDICT "
          else
            echo "模型没进包（gh 退出码 $rc），这一版 IPA 里没有尺子" | ann "M-VERDICT "
          fi
          tail -3 /tmp/m2c.log | ann "M2C "
          ls -R app/Sources | head -12 | ann "M-LS "
          exit 0

      # 纯诊断：身份 API 到底在不在 SDK，不依赖手机端就能判
      - name: probe Vision SDK symbols
        continue-on-error: true
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=8{print "::error::" p substr($0,1,230)}'; }
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          FW="$SDK/System/Library/Frameworks/Vision.framework"
          { echo "sdk=$SDK"; echo "fw_dir=$([ -d "$FW" ] && echo 在 || echo 不在)"; ls "$FW" 2>&1 | head -10; } | ann "VIS-LS "
          find "$SDK" -name "Vision.tbd" -o -name "Vision.h" 2>/dev/null | head -4 | ann "VIS-FIND " || true
          grep -rhoE "VN[A-Za-z]*FeaturePrint[A-Za-z]*" "$FW" 2>/dev/null | sort -u | ann "VIS-SYM " || true
          grep -rhB2 -A6 "IdentityFeaturePrint" "$FW" 2>/dev/null | head -14 | ann "VIS-DECL " || true

      # 纯诊断：人脸特征点属性名从 SDK 头文件里抠，不靠猜（对齐要靠这 5 个点）
      # 全文写到 /tmp/lm.txt 随 release 发布——annotation 一个 step 只有约 10 条、每条 200 字，上一轮属性名就是被它截没的
      - name: probe face landmark names
        continue-on-error: true
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=8{print "::error::" p substr($0,1,200)}'; }
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          HDR="$SDK/System/Library/Frameworks/Vision.framework/Headers"
          : > /tmp/lm.txt
          echo "hdr=$HDR" >> /tmp/lm.txt
          ls "$HDR" 2>&1 | head -40 >> /tmp/lm.txt
          for C in VNFaceLandmarks2D VNFaceLandmarks VNFaceLandmarkRegion2D VNFaceLandmarkRegion \
                   VNFaceObservation VNDetectFaceLandmarksRequest VNDetectFaceRectanglesRequest; do
            echo "===== $C =====" >> /tmp/lm.txt
            awk -v c="$C" 'FNR==1{f=0}
                           !f && $0 ~ "@interface " c " |@implementation " c " " {f=1}
                           f {print}
                           f && /^@end/ {f=0}' "$HDR"/*.h >> /tmp/lm.txt 2>/dev/null
            echo "===== $C (class 前向声明) =====" >> /tmp/lm.txt
            grep -hn "@interface $C" "$HDR"/*.h >> /tmp/lm.txt 2>/dev/null
          done
          echo "===== 所有 VNFaceLandmarkRegion2D 后面跟的名字 =====" >> /tmp/lm.txt
          grep -rh "VNFaceLandmarkRegion2D" "$HDR"/*.h 2>/dev/null \
            | sed -E 's/.*VNFaceLandmarkRegion2D[^A-Za-z_]*([A-Za-z_][A-Za-z0-9_]*).*/\1/' \
            | sort -u | tr '\n' ' ' >> /tmp/lm.txt
          echo "" >> /tmp/lm.txt
          echo "===== 含 roll/yaw/pitch/expression/quality 的属性名 =====" >> /tmp/lm.txt
          grep -rhE "^@property.*(roll|yaw|pitch|expression|Quality)" "$HDR"/*.h 2>/dev/null \
            | sed -E 's/^@property[^;]*[[:space:]]*([A-Za-z_][A-Za-z0-9_]*)( .*)?;/\1/' \
            | sort -u | tr '\n' ' ' >> /tmp/lm.txt
          echo "" >> /tmp/lm.txt
          echo "===== 请求类 =====" >> /tmp/lm.txt
          grep -rhoE "VN(Detect|Generate)[A-Za-z0-9_]*Request" "$HDR" 2>/dev/null | sort -u | tr '\n' ' ' >> /tmp/lm.txt
          echo "" >> /tmp/lm.txt
          echo "lm.txt bytes=$(wc -c < /tmp/lm.txt) 区块数=$(grep -c '^===== ' /tmp/lm.txt)" | ann "LM-FILE "
          grep -c "@property" /tmp/lm.txt | awk '{print "抠到 @property 行 " $1 " 条"}' | ann "LM-COUNT "
          sed -n '/VNFaceLandmarkRegion2D 后面跟的名字/,/^$/p' /tmp/lm.txt | head -3 | ann "RGN "
          sed -n '/含 roll\/yaw\/pitch/,/^$/p' /tmp/lm.txt | head -3 | ann "OBS "
          exit 0

      - name: install xcodegen
        run: |
          set -euo pipefail
          curl -sL -o /tmp/xg.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          rm -rf /tmp/xg && unzip -q /tmp/xg.zip -d /tmp/xg
          sudo /tmp/xg/xcodegen/install.sh
          xcodegen --version

      - name: generate project
        working-directory: app
        run: xcodegen --spec project.yml

      - name: build
        working-directory: app
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -project HelloLC.xcodeproj -scheme HelloLC \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= EXPANDED_CODE_SIGN_IDENTITY= \
            build 2>&1 | tee /tmp/build.log

      - name: package ipa
        working-directory: app
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          echo "built app: $APP" >> /tmp/build.log
          file "$APP/HelloLC" | tee -a /tmp/build.log
          rm -rf Payload hello.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          ditto -c -k --keepParent Payload hello.ipa
          ls -la hello.ipa | tee -a /tmp/build.log

      # 上手机前先答清楚：xcodegen 有没有把 mlpackage 当一个文件交给 coremlc，产物里到底有没有编译好的模型
      - name: model in bundle check
        if: always()
        working-directory: app
        run: |
          set +e
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=4{print "::error::" p substr($0,1,230)}'; }
          { echo "pbxproj 引用 mbf.mlpackage 次数=$(grep -c 'mbf.mlpackage' HelloLC.xcodeproj/project.pbxproj 2>/dev/null)";
            echo "mlpackage 文件类型=$(grep -oE 'mbf\.mlpackage[^)]*|lastKnownFileType = [a-z.]*mlpackage[a-z.]*' HelloLC.xcodeproj/project.pbxproj 2>/dev/null | head -1)";
            echo "mlpackage 里被逐个引用的散文件数=$(grep -c 'Data/com.apple.CoreML' HelloLC.xcodeproj/project.pbxproj 2>/dev/null)"; } | ann "P-REF "
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' 2>/dev/null | head -1)
          { echo "app=$APP";
            echo "mlmodelc=$(find "$APP" -maxdepth 1 -name '*.mlmodelc' 2>/dev/null | head -2 | tr '\n' ' ')";
            echo "大小=$(du -sk "$APP"/*.mlmodelc 2>/dev/null | awk '{print $1"KB"}' | head -1)"; } | ann "B-MODEL "
          exit 0

      # 每个 step 的 annotation 有独立额度，诊断按 step 拆开，别堆在一个 step 里被截断
      - name: publish release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          cp /tmp/build.log ./build.log
          [ -s /tmp/lm.txt ] && cp /tmp/lm.txt ./lm.txt
          gh release delete channel-test --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create channel-test hello.ipa build.log $([ -s lm.txt ] && echo lm.txt) \
            --title "HelloLC build" \
            --prerelease \
            --notes "CI artifact for commit $GITHUB_SHA" 2>&1 | ann "REL "
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/channel-test/hello.ipa" | ann "REL "

      - name: report compile errors
        if: failure()
        working-directory: app
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=8{print "::error::" p substr($0,1,230)}'; }
          cp /tmp/build.log ./build.log 2>/dev/null || echo "no build log at all" > ./build.log
          grep -nE "error:|fatal error:" ./build.log | ann "ERR "

      - name: report release failure
        if: failure()
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          cp /tmp/build.log ./build.log 2>/dev/null || echo "no build log at all" > ./build.log
          gh release delete channel-test --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create channel-test build.log \
            --title "CI failed log" \
            --prerelease \
            --notes "no ipa this round" 2>&1 | ann "GH-FAIL "

  # 独立 job：苹果的工具链认不认 insightface 的小模型，跟出 IPA 互不影响
  coreml:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/checkout@v4

      - name: 检查试转脚本在不在
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=4{print "::error::" p substr($0,1,230)}'; }
          ls -l ci/ | ann "TRY-LS "
          cp ci/coreml_try.py /tmp/try.py
          cp ci/onnx_fix_shape.py /tmp/fixshape.py
          python -c "import ast;[ast.parse(open(f,encoding='utf-8').read()) for f in ('ci/coreml_try.py','ci/onnx_fix_shape.py')];print('两个脚本语法 OK，已放到 /tmp/try.py /tmp/fixshape.py')" | ann "TRY-CHK "

      - name: fetch onnx
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          code=$(curl -fsL --retry 3 --max-time 300 -o /tmp/sc.zip -w "%{http_code}" \
            https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_sc.zip)
          { echo "http=$code bytes=$(wc -c < /tmp/sc.zip 2>/dev/null)"; file /tmp/sc.zip; } | ann "GET " || true
          rm -rf /tmp/sc && mkdir -p /tmp/sc
          unzip -o -q /tmp/sc.zip -d /tmp/sc 2>&1 | ann "UNZ " || echo "unzip 失败" | ann "UNZ "
          test -s /tmp/sc/w600k_mbf.onnx
          # pytorch 1.8 导出的 batch 维是符号 None；转换器要求固定形状
          pip install --quiet --no-cache-dir onnx >>/tmp/pipfix.log 2>&1
          python /tmp/fixshape.py /tmp/sc/w600k_mbf.onnx /tmp/sc/w600k_fixed.onnx 2>&1 | ann "FIX "
          ls -l /tmp/sc/*.onnx | ann "FIX-LS "
          test -s /tmp/sc/w600k_fixed.onnx

      - name: 试 onnx2coreml（MIL 路线 + 数值对齐）
        run: |
          set +e          # 一个 step 只留约 10 条 annotation ⇒ 判定行必须排在明细之前
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=3{print "::error::" p substr($0,1,230)}'; }
          rm -rf /tmp/o2c /tmp/mbf_o2c.mlpackage && mkdir -p /tmp/o2c
          python -m venv /tmp/o2c >/dev/null 2>&1
          /tmp/o2c/bin/pip install --quiet --no-cache-dir onnx2coreml coremltools onnx onnxruntime numpy >>/tmp/o2cpip.log 2>&1
          /tmp/o2c/bin/onnx2coreml inspect /tmp/sc/w600k_fixed.onnx > /tmp/inspect.log 2>&1
          /tmp/o2c/bin/onnx2coreml convert /tmp/sc/w600k_fixed.onnx -o /tmp/mbf_o2c.mlpackage \
            --format mlpackage --verify > /tmp/o2c.log 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then echo "onnx2coreml 转成功且 --verify 数值对齐通过" | ann "O2C-VERDICT "; else echo "onnx2coreml 失败 退出码 $rc" | ann "O2C-VERDICT "; fi
          echo "转换器 $(/tmp/o2c/bin/pip show onnx2coreml 2>/dev/null | awk '/^Version/{print $2}') / coremltools $(/tmp/o2c/bin/python -c 'import coremltools as ct;print(ct.__version__)' 2>&1 | tail -1)；产物 $(du -sk /tmp/mbf_o2c.mlpackage 2>/dev/null | awk '{print $1"KB"}')" | ann "O2C-ENV "
          grep -iE "conv|relu|gemm|add|reshape|total|support|op" /tmp/inspect.log | head -3 | ann "O2C-OPS "
          tail -3 /tmp/o2c.log | ann "O2C "
          [ $rc -eq 0 ] || exit 1

      - name: 逐版本试转 onnx → CoreML
        if: always()
        run: |
          set +e          # 一个 step 只留约 10 条 annotation ⇒ 判定行排在明细之前
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=5{print "::error::" p substr($0,1,230)}'; }
          rm -rf /tmp/venvs /tmp/ver.log /tmp/pip.log && mkdir -p /tmp/venvs
          for V in 9.0 8.0 7.2 6.0 5.2; do
            python -m venv "/tmp/venvs/$V" >/dev/null 2>&1
            "/tmp/venvs/$V/bin/pip" install --quiet --no-cache-dir "coremltools==$V" onnx >>/tmp/pip.log 2>&1
            "/tmp/venvs/$V/bin/python" /tmp/try.py "$V" >>/tmp/ver.log 2>&1
          done
          if grep -q "OK(" /tmp/ver.log; then
            echo "有 coremltools 版本能直接吃 onnx，看 SUM 行哪个版本" | ann "VERDICT "
          else
            echo "这 5 个 coremltools 版本没有一个把 onnx 转成 CoreML" | ann "VERDICT "
          fi
          grep "^SUM " /tmp/ver.log | ann "SUM "
          [ -s /tmp/ver.log ] || tail -3 /tmp/pip.log | ann "PIPLOG "
          grep -q "OK(" /tmp/ver.log || exit 1

      - name: 把探测日志发到固定 release（无 token 也能读）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          gh release delete channel-coreml --cleanup-tag -y >/dev/null 2>&1 || true
          rm -f ./*.log
          for f in /tmp/ver.log /tmp/o2c.log /tmp/inspect.log /tmp/pip.log /tmp/o2cpip.log; do
            [ -s "$f" ] && cp "$f" "./$(basename "$f")"
          done
          gh release create channel-coreml ./*.log \
            --title "coreml 探测日志" --prerelease \
            --notes "逐版本 onnx→CoreML 与 onnx2coreml 数值对齐的完整日志" >/tmp/rel.log 2>&1
          rcrel=$?
          echo "gh 退出码 $rcrel，待上传日志 $(ls ./*.log 2>/dev/null | wc -l) 个" >>/tmp/rel.log
          # 发没发出去，只认从匿名接口能不能列出来
          curl -fsSL -o /tmp/relcheck.json -w "%{http_code}\n" \
            https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/channel-coreml >>/tmp/rel.log 2>&1
          if grep -q '"tag_name": *"channel-coreml"' /tmp/relcheck.json; then
            echo "日志已发到 channel-coreml，匿名可读" | ann "REL-VERDICT "
          else
            echo "日志没发出去（上轮就是栽在这：step 绿但 release 404）" | ann "REL-VERDICT "
          fi
          grep -oE '"name": *"[^"]*\.log"|"message": *"[^"]*"' /tmp/relcheck.json | ann "REL-GET "
          cat /tmp/rel.log | ann "REL "
          grep -q '"tag_name": *"channel-coreml"' /tmp/relcheck.json || exit 1

      - name: keep artifact
        if: always()
        run: |
          set +e
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          cd /tmp && zip -r -q mbf_coreml.zip mbf_* 2>/dev/null
          ls -l /tmp/mbf_coreml.zip | ann "ART "

      - name: upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mbf-coreml
          path: /tmp/mbf_coreml.zip
          if-no-files-found: ignore
