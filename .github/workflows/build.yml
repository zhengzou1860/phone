name: build-unsigned-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipa
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: show toolchain
        run: sw_vers && xcodebuild -version && xcodebuild -showsdks | grep -i ios

      # 纯诊断：身份 API 到底在不在 SDK，不依赖手机端就能判
      - name: probe Vision SDK symbols
        continue-on-error: true
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=8{print "::error::" p substr($0,1,230)}'; }
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          FW="$SDK/System/Library/Frameworks/Vision.framework"
          { echo "sdk=$SDK"; echo "fw_dir=$([ -d "$FW" ] && echo 在 || echo 不在)"; ls "$FW" 2>&1 | head -10; } | ann "VIS-LS "
          find "$SDK" -name "Vision.tbd" -o -name "Vision.h" 2>/dev/null | head -4 | ann "VIS-FIND " || true
          grep -rhoE "VN[A-Za-z]*FeaturePrint[A-Za-z]*" "$FW" 2>/dev/null | sort -u | ann "VIS-SYM " || true
          grep -rhB2 -A6 "IdentityFeaturePrint" "$FW" 2>/dev/null | head -14 | ann "VIS-DECL " || true

      - name: install xcodegen
        run: |
          set -euo pipefail
          curl -sL -o /tmp/xg.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          rm -rf /tmp/xg && unzip -q /tmp/xg.zip -d /tmp/xg
          sudo /tmp/xg/xcodegen/install.sh
          xcodegen --version

      - name: generate project
        working-directory: app
        run: xcodegen --spec project.yml

      - name: build
        working-directory: app
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -project HelloLC.xcodeproj -scheme HelloLC \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= EXPANDED_CODE_SIGN_IDENTITY= \
            build 2>&1 | tee /tmp/build.log

      - name: package ipa
        working-directory: app
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          echo "built app: $APP" >> /tmp/build.log
          file "$APP/HelloLC" | tee -a /tmp/build.log
          rm -rf Payload hello.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          ditto -c -k --keepParent Payload hello.ipa
          ls -la hello.ipa | tee -a /tmp/build.log

      # 每个 step 的 annotation 有独立额度，诊断按 step 拆开，别堆在一个 step 里被截断
      - name: publish release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          cp /tmp/build.log ./build.log
          gh release delete channel-test --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create channel-test hello.ipa build.log \
            --title "HelloLC build" \
            --prerelease \
            --notes "CI artifact for commit $GITHUB_SHA" 2>&1 | ann "REL "
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/channel-test/hello.ipa" | ann "REL "

      - name: report compile errors
        if: failure()
        working-directory: app
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=8{print "::error::" p substr($0,1,230)}'; }
          cp /tmp/build.log ./build.log 2>/dev/null || echo "no build log at all" > ./build.log
          grep -nE "error:|fatal error:" ./build.log | ann "ERR "

      - name: report release failure
        if: failure()
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          cp /tmp/build.log ./build.log 2>/dev/null || echo "no build log at all" > ./build.log
          gh release delete channel-test --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create channel-test build.log \
            --title "CI failed log" \
            --prerelease \
            --notes "no ipa this round" 2>&1 | ann "GH-FAIL "

  # 独立 job：苹果的工具链认不认 insightface 的小模型，跟出 IPA 互不影响
  coreml:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/checkout@v4

      - name: 检查试转脚本在不在
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=4{print "::error::" p substr($0,1,230)}'; }
          ls -l ci/ | ann "TRY-LS "
          cp ci/coreml_try.py /tmp/try.py
          python -c "import ast; ast.parse(open('ci/coreml_try.py').read()); print('试转脚本语法 OK，已放到 /tmp/try.py')" | ann "TRY-CHK "

      - name: fetch onnx
        run: |
          set -uo pipefail
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          code=$(curl -fsL --retry 3 --max-time 300 -o /tmp/sc.zip -w "%{http_code}" \
            https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_sc.zip)
          { echo "http=$code bytes=$(wc -c < /tmp/sc.zip 2>/dev/null)"; file /tmp/sc.zip; } | ann "GET " || true
          rm -rf /tmp/sc && mkdir -p /tmp/sc
          unzip -o -q /tmp/sc.zip -d /tmp/sc 2>&1 | ann "UNZ " || echo "unzip 失败" | ann "UNZ "
          ls -la /tmp/sc | ann "UNZ " || true
          test -s /tmp/sc/w600k_mbf.onnx

      - name: 逐版本试转 onnx → CoreML
        run: |
          set +e          # 本步末位是管道且恒回 0；红绿由下面 VERDICT 行显式下
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=10{print "::error::" p substr($0,1,230)}'; }
          rm -rf /tmp/venvs /tmp/mbf_* /tmp/ver.log /tmp/pip.log && mkdir -p /tmp/venvs
          echo "开始逐版本试转" | ann "TRY0 "
          for V in 9.0 8.0 7.2 6.0 5.2; do
            python -m venv "/tmp/venvs/$V" >/dev/null 2>&1
            "/tmp/venvs/$V/bin/pip" install --quiet --no-cache-dir "coremltools==$V" onnx >>/tmp/pip.log 2>&1
            "/tmp/venvs/$V/bin/python" /tmp/try.py "$V" >>/tmp/ver.log 2>&1
            echo "$V 跑完" | ann "TRY "
          done
          tail -5 /tmp/pip.log | ann "PIPLOG "
          grep "^SUM " /tmp/ver.log | ann "SUM "
          grep -q "OK(" /tmp/ver.log || { echo "这 5 个版本没有一个能吃下 w600k_mbf.onnx，逐版本原因见 SUM 行" | ann "VERDICT "; exit 1; }
          echo "至少一个版本转成了，产物在 /tmp/mbf_*" | ann "VERDICT "

      - name: keep artifact
        if: always()
        run: |
          set +e
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          cd /tmp && zip -r -q mbf_coreml.zip mbf_* 2>/dev/null
          ls -l /tmp/mbf_coreml.zip | ann "ART "

      - name: upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mbf-coreml
          path: /tmp/mbf_coreml.zip
          if-no-files-found: ignore
