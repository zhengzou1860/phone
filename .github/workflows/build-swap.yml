name: build-swap-ipa

# 第五条线（手机本地换脸）自己的分支、自己的发布位，不碰别人的 channel。
# 剪辑那份 build.yml 是 "push 到 main 就触发"且没有 paths 过滤 ⇒ 任何东西都不往 main 推。
# 要重跑：本机 gh 没登录，走 git push。空提交不算——上面有 paths 过滤，一个文件都没改就不匹配，push 了也不触发；
# 要么改动那些路径里的任一个（在本文件加一行注释也算），要么在仓库页上手动 workflow_dispatch。
# ci/fsx_pack.py 是把 ci/fsx_probe.py 的帮手直接 import 过去用的，所以两条都列进触发路径：探针那边改一式，这里就得重新出一版模型。
on:
  push:
    branches: [swap]
    paths:
      - 'app/SourcesSwap/**'
      - 'app/project-swap.yml'
      - '.github/workflows/build-swap.yml'
      - 'ci/fsx_pack.py'
      - 'ci/fsx_probe.py'
      - 'ci/fsx_fixtures/**'
      - 'ci/identcodec/**'
      - 'ci/fsxgeo_check/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swap
  cancel-in-progress: true

jobs:
  swap:
    runs-on: macos-latest
    # 这一版是「下两张大网（403 MB＋174 MB）→ 换脸网转 fp16、身份证转 fp32 → 打成 ~566 MB 归档传上发布位 → 再编 ipa」。
    # 单张几百 MB 的转换实测几十秒，但 --verify 和落盘读回来各自还要几十秒到几分钟；上一轮照「四张小网」估的 60 分钟不成立。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: show toolchain
        run: sw_vers && xcodebuild -version && xcodebuild -showsdks | grep -i ios

      # 本机（Windows）没有 Swift 工具链，SwapIdents 那套字节格式从来没被真编译器跑过。
      # 这条线栽过一次：0.8~0.12 每一格存档都是空包——putFloats 里第四个字节写的是 `b >> 24`，
      # 而那时 b 已经移过三次位、剩全 0，于是每个 float 的符号＋指数都被抹掉，写进去模长 1.0000、读回来 0.0000。
      # ⇒ 格式这套东西必须在有真编译器的机器上逐位对账，判不出 PASS 就不许往下出包：
      # 那种包每一个「已存的人」都会静默出原脸。这一版格式只剩身份证（18 个权重不再存），
      # 所以第五条判据是「旧版（版本 1、带权重）的字节必须整份判读失败」，不许把旧包当新包读。
      - name: 身份包编解码逐位对账（不过就不出包）
        run: |
          rec() { tee -a /tmp/model.log; }
          touch /tmp/build.log   # 这步在 build 之前：「report failure log」是 cat model.log build.log，
                                 # 缺这个文件那条 cat 会失败、把日志盖成 "no build log at all"，判决行就丢了
          xcrun swiftc -O app/SourcesSwap/SwapIdents.swift ci/identcodec/main.swift -o /tmp/identtest 2>&1 | rec
          if [ ! -x /tmp/identtest ]; then echo "CODEC-VERDICT FAIL 测试没编出来" | rec; exit 1; fi
          /tmp/identtest 2>&1 | rec
          grep -q "^CODEC-VERDICT PASS" /tmp/model.log || { echo "上面几行就是写／读／交叉／半截／旧版的逐位结果"; exit 1; }

      # FsxGeo 那一份逐式（裁片、贴回遮罩三刀、往下多贴、收口）同样从来没被真编译器跑过，而且比字节格式更隐蔽：
      # 模型对账那三层是把 fixture 直接喂进网，绕过了手机自己裁片那一步——0.37 上机「整张脸偏蓝」就是这么漏的
      # （BGRA 内存序顺着读成 BGR，网照样跑、一句错都不报）。这一步把 FsxGeo 单编成命令行跑 selfTest，
      # 里面每一式都自带「对／错」，出一个错就不出包：这种错装到手机上只能靠肉眼，一趟几十分钟。
      - name: 几何逐式自测（不过就不出包）
        run: |
          rec() { tee -a /tmp/model.log; }
          touch /tmp/model.log /tmp/build.log
          xcrun swiftc -O app/SourcesSwap/FsxGeo.swift ci/fsxgeo_check/main.swift -o /tmp/fsxgeo 2>&1 | rec
          if [ ! -x /tmp/fsxgeo ]; then echo "GEO-VERDICT FAIL 自测没编出来" | rec; exit 1; fi
          /tmp/fsxgeo 2>&1 | rec
          grep -q "^GEO-VERDICT PASS" /tmp/model.log || { echo "上面那行就是 selfTest 原文，哪一格写着「错」就是哪一式断了"; exit 1; }

      # 必须钉 3.11：runner 默认的 python3 落在 onnx2coreml 的 Requires-Python >=3.11,<3.14 之外，
      # 第 1 轮 pip 直接回 "Could not find a version that satisfies the requirement onnx2coreml"，
      # 后面三张图的 convert 全是 rc=127（命令根本没装上）。
      - name: 装 python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装 python 3.11 + 转换器
        run: |
          set +e
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          rec() { tee -a /tmp/model.log; }
          # 这里原来有一句 rm -f /tmp/model.log：它把前面两道闸门（身份包编解码、几何自测）的判决行
          # 一起清掉了，出包之后想问「那一趟闸门到底跑了什么」只能翻 CI 那一步，翻不到就成谜。
          # 改成缺了就建、有不许清：同一份 build.log 里从 CODEC-VERDICT 到 M-VERDICT 一路读下来。
          [ -f /tmp/model.log ] || touch /tmp/model.log
          echo "PY 版本=$(python3 -V 2>&1)" | rec
          python3 -m venv /tmp/m2c >/dev/null 2>&1
          # opencv 是 fsx_pack 读 fixture 那三张 png 用的（探针那边同款依赖，探针已跑绿）
          /tmp/m2c/bin/pip install --quiet --no-cache-dir onnx2coreml coremltools onnx onnxruntime numpy opencv-python-headless >/tmp/pip.log 2>&1
          echo "PIP-VERDICT onnx2coreml=$(/tmp/m2c/bin/pip show onnx2coreml 2>/dev/null | awk '/^Version/{print $2}') coremltools=$(/tmp/m2c/bin/python -c 'import coremltools as ct;print(ct.__version__)' 2>&1 | tail -1) ort=$(/tmp/m2c/bin/pip show onnxruntime 2>/dev/null | awk '/^Version/{print $2}') cv2=$(/tmp/m2c/bin/python -c 'import cv2;print(cv2.__version__)' 2>&1 | tail -1)" | rec | ann "PIP "
          echo "PIP-VERDICT 可执行=$([ -x /tmp/m2c/bin/onnx2coreml ] && echo 在 || echo 不在)" | rec | ann "PIP "
          tail -6 /tmp/pip.log | rec | ann "PIP-TAIL "
          # 判决必须落成文件：annotation 我这边匿名读不到，宁可多发一份 model.log。
          echo "M-VERDICT 转换器就绪" | rec
          exit 0

      # 权重不进 git（577 MB），只在这台机器上下一次，字节数钉死：换源就换字节，换字节就换画面。
      # hyperswap_1c_256.onnx = 402742682，w600k_r50.onnx = 174383860（本机 PC 上验通的那两份，逐字节同一个）。
      # 这一版特意再钉一道 sha256：hyperswap 的 1a 和 1c 字节数一模一样（都是 402742682），
      # 只比长度根本分不开这两份——而拿 1c 的标答去对 1a 的网，第①层那关只会报「画面不对」，
      # 报不出「下错了文件」。sha 一句话就能说清是哪一份。
      # 下在 /tmp/fm 而不是工程里：xcodegen 会扫工程，模型一旦落进 sources 就被当编译输入交给
      # coremlc generate（VR3D 第 5 轮正是这么死在 build 阶段，A valid manifest does not exist）。
      - name: 下 hyperswap_1c_256（403 MB）
        run: |
          set +e
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          rec() { tee -a /tmp/model.log; }
          mkdir -p /tmp/fm
          WANT=402742682
          WANT_SHA=5528c2d76fe9986c99d829278987ef9f3a630cb606db7628d02b57b330f406a5
          U=https://github.com/facefusion/facefusion-assets/releases/download/models-3.3.0/hyperswap_1c_256.onnx
          code=$(curl -sS -L --retry 3 --retry-all-errors --max-time 1200 -o /tmp/fm/hyperswap_1c_256.onnx -w '%{http_code}' "$U")
          sz=$(wc -c < /tmp/fm/hyperswap_1c_256.onnx 2>/dev/null | tr -d ' ')
          got=$(shasum -a 256 /tmp/fm/hyperswap_1c_256.onnx 2>/dev/null | awk '{print $1}')
          echo "DL-VERDICT hyperswap http=$code bytes=${sz:-0}（要 $WANT）sha=${got:-无}（要 $WANT_SHA）" | rec
          # 这里一律 exit 0：下载／转换没成也先把 ipa 编出来，一轮就把两件事都问了（本机没有 Swift，
          # 编译错和模型错挤在一轮里看比分开快得多）。真正的闸门在「publish release」最后那条版本比对上。
          if [ "${sz:-0}" != "$WANT" ] || [ "${got:-无}" != "$WANT_SHA" ]; then
            echo "DL-VERDICT hyperswap 这份不是 PC 验过的那一份 ⇒ 这一版不发模型，发布位上那一版对不上号的会被闸门拦下" | rec | ann "DL "
            exit 0
          fi
          exit 0

      - name: 下 buffalo_l 取 w600k_r50（人脸向量网）
        run: |
          set +e
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          rec() { tee -a /tmp/model.log; }
          WANT=174383860
          U=https://github.com/deepinsight/insightface/releases/download/model-zoo/buffalo_l.zip
          code=$(curl -sS -L --retry 3 --retry-all-errors --max-time 900 -o /tmp/fm/buffalo_l.zip -w '%{http_code}' "$U")
          echo "DL-VERDICT zip http=$code bytes=$(wc -c < /tmp/fm/buffalo_l.zip 2>/dev/null | tr -d ' ')" | rec
          unzip -o -q /tmp/fm/buffalo_l.zip -d /tmp/fm/blk 2>&1 | head -3 | rec
          find /tmp/fm/blk -name 'w600k_r50.onnx' -exec cp {} /tmp/fm/w600k_r50.onnx \;
          rm -rf /tmp/fm/buffalo_l.zip /tmp/fm/blk
          sz=$(wc -c < /tmp/fm/w600k_r50.onnx 2>/dev/null | tr -d ' ')
          echo "DL-VERDICT w600k_r50 bytes=${sz:-0}（要 $WANT）" | rec | ann "DL "
          if [ "${sz:-0}" != "$WANT" ]; then
            echo "DL-VERDICT w600k_r50 字节对不上 ⇒ 下面打包必败（闸门在 publish 那条版本比对上）" | rec | ann "DL "
            exit 0
          fi
          ls -l /tmp/fm | rec | ann "DL-LS "
          exit 0

      # 这一版整条链路只有两张网：w600k_r50（112→512 维身份证）＋ hyperswap_1c_256（256 进 256 出，
      # 源直接吃归一化后的 512 维向量，不再乘 buff2fs 那张 512×512——所以也没有 emap.bin 了）。
      # 发布配方：换脸网 fp16、身份证 fp32。换脸网一帧跑一次，fp16 拿真 fixture 对 PC 标答是
      # PSNR 52.71 dB／max 3.71 灰阶／非有限数 0（与 fp32 同一份数），Mac 上一次推理 184→79 ms；
      # 身份证只在身份复测里用，fp16 的 cos 会从 1.000000 掉到 0.999898，那一格决定「还是不是那个人」，
      # 所以仍转 fp32。上一代 128 网判死 fp16 用的是转换器随机噪声那套，对生成式网不算数。
      # 对账三层一起过才许打包（onnxruntime 基线／转换器 --verify／落盘的包读回来再预测），
      # 任何一层不过就地失败、一个文件都不打包。这一条 step 本身一律 exit 0（见上面下载那步的理由：
      # 本机没有 Swift，一轮把「编译过不过」和「模型对不对账」两件事都问了才算快），
      # 真闸门在 publish 最后那条「发布位上的 models.json 版本必须等于这一轮算出来的版本」上。
      # 403 MB 那张光转换就几十秒、还带 --verify，加上下两次大文件，上一轮照「四张小网」估的 60 分钟不成立。
      - name: 转两张网＋与 PC 对账＋打包 models.bin
        run: |
          set +e
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=10{print "::error::" p substr($0,1,230)}'; }
          rec() { tee -a /tmp/model.log; }
          rm -rf app/SwapModel && mkdir -p app/SwapModel
          /usr/bin/time -l /tmp/m2c/bin/python ci/fsx_pack.py --onnx-dir /tmp/fm \
            --fixtures ci/fsx_fixtures --out-root app/SwapModel --cli /tmp/m2c/bin/onnx2coreml \
            >/tmp/fsx_pack_out.log 2>&1
          rc=$?
          echo "PACK rc=$rc" | rec
          grep "^FXP-" app/SwapModel/fsx_pack.log 2>/dev/null | rec | ann "FXP "
          grep -E "maximum resident|real +[0-9]|wall clock" /tmp/fsx_pack_out.log | tr -s ' ' | rec
          tail -6 /tmp/fsx_pack_out.log | rec | ann "PACK-TAIL "
          df -h / | tail -1 | rec | ann "DF "
          du -sk app/SwapModel /tmp/fm 2>/dev/null | rec | ann "DU "
          if [ $rc -ne 0 ]; then
            echo "PACK-VERDICT 败（rc=$rc）⇒ 这一版不发模型：对不上账就出片，那种画面换的不是那个人" | rec | ann "PACK "
            echo "::error::PACK-FAIL rc=$rc（判据见上面 FXP- 几行／发布位上的 fsx_pack.log）"
            exit 0
          fi
          ls -l app/SwapModel | rec | ann "LS "
          echo "PACK-VERDICT 成 models.bin $([ -s app/SwapModel/models.bin ] && echo 有 || echo 缺)" | rec | ann "PACK "
          exit 0

      - name: install xcodegen
        run: |
          set -euo pipefail
          curl -sL -o /tmp/xg.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          rm -rf /tmp/xg && unzip -q /tmp/xg.zip -d /tmp/xg
          sudo /tmp/xg/xcodegen/install.sh
          xcodegen --version

      - name: generate project
        working-directory: app
        run: xcodegen --spec project-swap.yml

      - name: build
        working-directory: app
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild -project SwapBench.xcodeproj -scheme SwapBench \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= EXPANDED_CODE_SIGN_IDENTITY= \
            build 2>&1 | tee /tmp/build.log

      # 两张网不进 ipa：它们打成 models.bin 挂在 release 上，手机第一次用时自己下到
      # Documents/swap_models。这样改了程序不用重下模型（版本号＝两张 onnx 的 sha256 加转换配方）。
      # 包里留着模型的话每装一次程序就得搬一遍几百 MB 权重，那正是这一版要消掉的事。
      - name: package ipa
        working-directory: app
        run: |
          set -euo pipefail
          rec() { tee -a /tmp/model.log; }
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          echo "built app: $APP" >> /tmp/build.log
          file "$APP/SwapBench" | tee -a /tmp/build.log
          # 包里一个模型都不该有：留着的不是"双保险"，是"改了程序还得重下几百 MB"
          left=""
          for N in fsx_arc fsx_swap; do
            if [ -d "$APP/$N.mlpackage" ] || [ -d "$APP/$N.mlmodelc" ]; then left="$left $N"; fi
          done
          if [ -n "$left" ]; then
            echo "P-VERDICT 包里还有模型$left ⇒ 这一版模型没真正分离出去" | rec
          else
            echo "P-VERDICT 包里没有模型（两张网＋chain.txt 在发布位上：models.bin）｜这一版手机上第一次用会自己下" | rec
          fi
          echo "P-VERDICT 模型归档 $([ -s SwapModel/models.bin ] && echo 有 || echo 缺)｜$(wc -c < SwapModel/models.bin 2>/dev/null | tr -d ' ') 字节｜chain.txt $([ -s SwapModel/chain.txt ] && cat SwapModel/chain.txt || echo 缺)" | rec
          rm -rf Payload swap.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          ditto -c -k --keepParent Payload swap.ipa
          ls -la swap.ipa | tee -a /tmp/build.log

      - name: bundle check
        if: always()
        working-directory: app
        run: |
          set +e
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=5{print "::error::" p substr($0,1,230)}'; }
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' 2>/dev/null | head -1)
          { echo "app=$APP"
            for N in fsx_arc fsx_swap; do
              echo "包内 $N=$([ -d "$APP/$N.mlpackage" ] && echo 在 || echo 不在) 大小=$(du -sk "$APP/$N.mlpackage" 2>/dev/null | awk '{print $1"KB"}')"
            done
            echo "mlmodelc=$(find "$APP" -maxdepth 1 -name '*.mlmodelc' 2>/dev/null | tr '\n' ' ')"
            echo "整个 app=$(du -sk "$APP" 2>/dev/null | awk '{print $1"KB"}')"
            echo "swap.ipa=$(wc -c < swap.ipa 2>/dev/null | tr -d ' ') 字节"
            echo "models.bin=$(wc -c < SwapModel/models.bin 2>/dev/null | tr -d ' ') 字节"
            echo "chain.txt=$(cat SwapModel/chain.txt 2>/dev/null)（要 hyperswap-1c-256）"
            echo "models.json=$(wc -c < SwapModel/models.json 2>/dev/null | tr -d ' ') 字节"; } | tee -a /tmp/model.log | ann "B-VERDICT "
          exit 0

      - name: publish release
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          cat /tmp/model.log /tmp/build.log > ./build.log 2>/dev/null || cp /tmp/build.log ./build.log
          # 转换/打包的完整日志从 /tmp 和 SwapModel 搬进来再挂：少一个文件就整条 gh 命令报错、结果一个都发不出去
          for f in fsx_pack_out pip; do
            [ -s "/tmp/$f.log" ] && cp "/tmp/$f.log" "./$f.log"
          done
          files="build.log"          # swap.ipa 不在这一串里：它单独传、传完当场验（见下面 IPA-UPLOAD 那一趟）
          for f in fsx_pack.log fsx_summary.json; do
            [ -s "SwapModel/$f" ] && files="$files SwapModel/$f"
          done
          for f in fsx_pack_out.log pip.log; do
            [ -s "$f" ] && files="$files $f"
          done
          # 模型资产只在模型真换了才重传：~690 MB 每次重传既慢，又有一个「删了还没传上」的窗口
          # （那一下窗口里手机下不到模型，整条线就废了）。版本号＝两张 onnx 的 sha256 加转换配方，
          # 程序改了模型没变 ⇒ 同一个版本 ⇒ 发布位上那一份原封不动。
          need_models=1
          lver=$(/tmp/m2c/bin/python -c "import json;print(json.load(open('SwapModel/models.json'))['version'])" 2>/dev/null)
          rm -rf /tmp/relmodels && mkdir -p /tmp/relmodels
          gh release download channel-swap --pattern models.json --dir /tmp/relmodels >/dev/null 2>&1
          rver=$(/tmp/m2c/bin/python -c "import json;print(json.load(open('/tmp/relmodels/models.json'))['version'])" 2>/dev/null)
          if [ -n "$lver" ] && [ "$lver" = "$rver" ]; then need_models=0; fi
          echo "REL-VERDICT 本地模型版本=${lver:-无}｜发布位上=${rver:-没有}｜要重传模型=$need_models" | ann "REL "
          if [ "$need_models" = 1 ]; then
            if [ -s SwapModel/models.bin ] && [ -s SwapModel/models.json ]; then
              files="$files SwapModel/models.bin SwapModel/models.json"
            else
              echo "::error::REL-FAIL 模型归档没打出来（models.bin/models.json 缺）⇒ 这一版手机上没有模型可用"
            fi
          fi
          echo "待发文件 [$files]" | ann "REL "
          # 不删了重发：删这一下下载位就出现空窗（99ffb71 那轮 CI 成功、包也造出来了，事后匿名读回 404）。
          gh release view channel-swap >/dev/null 2>&1 || gh release create channel-swap \
            --title "SwapBench build" --prerelease --notes "CI artifact（占位，等 asset 上传）" 2>&1 | ann "REL "
          # 关键顺序：建 release 时一个文件都不带 ⇒ 建完就是已发布状态。
          # gh release create 带文件时是先建草稿、传完才发布，中途没走完就永久卡在草稿里
          # （99ffb71 就是这样：事件里 swap.ipa=272620931 三张网全在，但 draft=true，匿名 HEAD 回 404）。
          # 所以 asset 一律用 upload --clobber 传进这条已发布的 release。
          gh release upload channel-swap $files --clobber 2>&1 | ann "REL "
          # swap.ipa 单独一趟一趟传，每趟完事当场看发布位上列没列到它：
          # --clobber 是先删后传，一次网络打嗝就能把发布位上那一份删没（run 41810625790 就这样——
          # build.log／fsx_summary.json／models.* 全传上去了，swap.ipa 不见了，匿名 HEAD 回 404，闸门判死）。
          for i in 1 2 3; do
            gh release upload channel-swap swap.ipa --clobber 2>&1 | ann "REL-IPA "
            listed=$(gh release view channel-swap --json assets --jq '.assets[] | .name' 2>/dev/null | grep -c '^swap\.ipa$')
            echo "IPA-UPLOAD 第 $i 趟｜发布位列到 swap.ipa=$listed" | ann "REL-IPA "
            [ "$listed" = 1 ] && break
            sleep 15
          done
          gh release edit channel-swap --draft=false --prerelease >/dev/null 2>&1
          RID=$(gh release view channel-swap --json id --jq .id 2>/dev/null)
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RID" \
            -d '{"draft":false,"prerelease":true,"tag_name":"channel-swap","name":"SwapBench build","body":"CI artifact for commit '"$GITHUB_SHA"'"}' \
            >/tmp/rel_patch.json 2>&1
          echo "R-PATCH id=$RID 回包=$(head -c 120 /tmp/rel_patch.json | tr -d '\n')" | ann "REL "
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/channel-swap/swap.ipa" | ann "REL "
          # 闸门同时满足才算数：isDraft=false（草稿手机拉不到）＋列到 swap.ipa／models.bin／models.json
          # ＋三个匿名 HEAD 都回 200 ＋发布位上那份 models.json 的版本号＝这一轮算出来的版本号。
          # 最后这一条是这一轮新加的关键：上面三条只看「文件在不在」，看不见「在的是哪一版」。
          # 0.36 换了整条链路（两张 fsx 网），发布位上原来那一份是 0.35 的四张网——
          # 打包那步要是败了，三份文件照样在、HEAD 照样 200，job 绿着，手机却在下用不了的模型。
          hit=0
          for i in 1 2 3; do
            draft=$(gh release view channel-swap --json isDraft --jq .isDraft 2>&1)
            names=$(gh release view channel-swap --json assets --jq '.assets[] | .name + "=" + (.size|tostring)' 2>&1 | tr '\n' ' ')
            anon=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 90 \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/channel-swap/swap.ipa" 2>/dev/null)
            anonm=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 90 \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/channel-swap/models.json" 2>/dev/null)
            anonb=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 90 \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/channel-swap/models.bin" 2>/dev/null)
            gotv=$(curl -sSL --max-time 90 \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/channel-swap/models.json" 2>/dev/null \
              | /tmp/m2c/bin/python -c "import json,sys;print(json.load(sys.stdin).get('version',''))" 2>/dev/null)
            echo "第 $i 次：isDraft=$draft｜匿名 HEAD ipa=$anon models.json=$anonm models.bin=$anonb｜发布位模型版本=${gotv:-读不出}（要 ${lver:-这一轮没算出来}）｜ [$names]" | ann "REL-GATE "
            if [ "$draft" = "false" ] && [ "$anon" = 200 ] && [ "$anonm" = 200 ] && [ "$anonb" = 200 ] \
               && [ -n "$lver" ] && [ "$gotv" = "$lver" ]; then
              # 三个名字分别点一遍：资产列出来的顺序不由我定（按整体串匹配会随排序翻车）
              case "$names" in *swap.ipa*)   ha=1 ;; *) ha=0 ;; esac
              case "$names" in *models.bin*) hb=1 ;; *) hb=0 ;; esac
              case "$names" in *models.json*) hc=1 ;; *) hc=0 ;; esac
              if [ "$ha" = 1 ] && [ "$hb" = 1 ] && [ "$hc" = 1 ]; then hit=1; break; fi
            fi
            sleep 10
          done
          [ "$hit" = 1 ] || echo "::error::REL-GATE 三次都没同时满足「isDraft=false」+「列到 swap.ipa／models.bin／models.json」+「三个匿名 HEAD 都回 200」+「发布位 models.json 的版本＝这一轮算出来的版本」⇒ 这一版手机上拿不到对的模型"
          if [ "$hit" = 1 ]; then exit 0; else exit 1; fi

      - name: report compile errors
        if: failure()
        working-directory: app
        run: |
          set +e
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=8{print "::error::" p substr($0,1,230)}'; }
          cat /tmp/model.log /tmp/build.log > ./build.log 2>/dev/null || cp /tmp/build.log ./build.log 2>/dev/null || echo "no build log at all" > ./build.log
          grep -nE "error:|fatal error:" ./build.log | ann "ERR "
          exit 0

      - name: report failure log
        if: failure()
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ann() { sed -e 's/%/%25/g' -e 's/:://g' | awk -v p="$1" 'NR<=6{print "::error::" p substr($0,1,230)}'; }
          cat /tmp/model.log /tmp/build.log > ./build.log 2>/dev/null || cp /tmp/build.log ./build.log 2>/dev/null || echo "no build log at all" > ./build.log
          files="build.log"
          for f in fsx_pack_out pip; do
            [ -s "/tmp/$f.log" ] && { cp "/tmp/$f.log" "./$f.log"; files="$files $f.log"; }
          done
          # 打包那步自己写的 FXP- 判据全在这份里：它败了的时候这是唯一能说清「哪一层对不上」的文件
          [ -s SwapModel/fsx_pack.log ] && files="$files SwapModel/fsx_pack.log"
          echo "待发文件 [$files]" | ann "GH-FAIL "
          gh release delete channel-swap-fail --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create channel-swap-fail $files \
            --title "SwapBench CI failed log" \
            --prerelease \
            --notes "no ipa this round" 2>&1 | ann "GH-FAIL "
          exit 0
